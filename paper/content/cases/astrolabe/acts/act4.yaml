      - { id: prokopchuk, label: "@person.nelya" }
      - { id: zgurska, label: "@person.marta" }
      - { id: veis, label: "@person.veis" }
      - { id: luhovyi, label: "@person.stepan" }
  - id: place
    prompt: "@acc.place"
    answer: tower
    options:
      - { id: tower, label: "@acc.places.tower" }
      - { id: storage, label: "@acc.places.storage" }
      - { id: basement, label: "@acc.places.basement" }
      - { id: shop, label: "@acc.places.shop" }
      - { id: nelyaHome, label: "@acc.places.nelyaHome" }
      - { id: sundial, label: "@acc.places.sundial" }
      - { id: chapel, label: "@acc.places.chapel" }
      - { id: abroad, label: "@acc.places.abroad" }
  - id: organizer
    prompt: "@acc.organizer"
    answer: bayda
    options:
      - { id: bayda, label: "@person.bayda" }
      - { id: zgurska, label: "@person.marta" }
      - { id: veis, label: "@person.veis" }
      - { id: prokopchuk, label: "@person.nelya" }
      - { id: dorosh, label: "@person.dorosh" }

