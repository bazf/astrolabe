# Акт 4 «Вежа» і фінал. Числа — з tools/solve.mjs: ledger.total2026 103000 / totalAll 316000,
# safe.trainee 1647 / safe 161174, cipher.trainee / cipher.detective.
# Шлюз D (у біблії — «Г») = сейф: він фізично відкриває конверт Г. Шифр (З-11) — окрема задача фіналу.

tasks:
  - id: Z6
    label: З-6
    depts: [A]
    title: "@task.z6.title"
    visibleWhen: { unlocked: "section:C" }
    question: { trainee: "@task.z6.q.trainee", detective: "@task.z6.q.detective" }
    unit: грн
    spec:
      trainee: { kind: number, min: 103000, max: 103000, step: 1 }
      detective: { kind: number, min: 316000, max: 316000, step: 1 }
    hints:
      trainee: ["@task.z6.h.trainee.1", "@task.z6.h.trainee.2", "@task.z6.h.trainee.3"]
      detective: ["@task.z6.h.detective.1", "@task.z6.h.detective.2", "@task.z6.h.detective.3"]
    onSolved: "@task.z6.solved"
  - id: Z8
    label: З-8
    depts: [A, O]
    title: "@task.z8.title"
    visibleWhen: { unlocked: "section:C" }
    question: { trainee: "@task.z8.q.trainee", detective: "@task.z8.q.detective" }
    gate: D
    lock: { after: 3, minutes: 5 }
    spec:
      trainee: { kind: number, min: 1647, max: 1647, step: 1 }
      detective: { kind: number, min: 161174, max: 161174, step: 1 }
    hints:
      trainee: ["@task.z8.h.trainee.1", "@task.z8.h.trainee.2", "@task.z8.h.trainee.3"]
      detective: ["@task.z8.h.detective.1", "@task.z8.h.detective.2", "@task.z8.h.detective.3"]
  - id: Z11
    label: З-11
    depts: [A, O]
    title: "@task.z11.title"
    visibleWhen: { unlocked: "section:D" }
    question: { trainee: "@task.z11.q.trainee", detective: "@task.z11.q.detective" }
    spec:
      trainee: { kind: choice, options: { south: [південний, південним, південь, південного] } }
      detective: { kind: choice, options: { tower: [вежа, вежу, вежі, годинникова вежа, годинникову вежу] } }
    hints:
      trainee: ["@task.z11.h.trainee.1", "@task.z11.h.trainee.2", "@task.z11.h.trainee.3"]
      detective: ["@task.z11.h.detective.1", "@task.z11.h.detective.2", "@task.z11.h.detective.3"]
    onSolved: "@task.z11.solved"

gates:
  D: { task: Z8, payload: { message: "@gate.d.message", unlock: ["section:D"] } }

decisions:
  - id: R-SAFE
    label: Ордер
    prompt: "@rsafe.prompt"
    context: "@rsafe.context"
    available: { all: [{ unlocked: "section:C" }, { not: { solved: Z8 } }] }
    options:
      - id: warrant
        label: "@rsafe.opt"
        effects:
          - { penaltyMin: 10 }
          - { clearLock: Z8 }
          - if: { level: trainee }
            then: [{ message: "@rsafe.after.trainee" }]
            else: [{ message: "@rsafe.after.detective" }]
  - id: R8
    label: Р8
    prompt: "@r8.prompt"
    context: "@r8.context"
    available: { all: [{ unlocked: "section:C" }, { any: [{ flag: story_published }, { solved: Z6 }, { solved: Z7 }] }] }
    options:
      - id: a
        label: "@r8.opt.a"
        effects:
          - { set: marta_deal, value: true }
          - { unlock: C14 }
          - { message: "@r8.after.a" }
      - id: b
        label: "@r8.opt.b"
        effects:
          - { set: marta_charged, value: true }
          - { message: "@r8.after.b" }
      - id: c
        label: "@r8.opt.c"
        effects:
          - { message: "@r8.after.c" }
  - id: R9
    label: Операція
    prompt: "@r9.prompt"
    context: "@r9.context"
    available: { any: [{ solved: Z11 }, { fired: E5 }] }
    options:
      - { id: tower, label: "@r9.opt.tower", effects: [{ set: op1, value: tower }, { set: op_done, value: true }, { message: "@r9.after" }] }
      - { id: station, label: "@r9.opt.station", effects: [{ set: op1, value: station }, { set: op_done, value: true }, { message: "@r9.after" }] }
      - { id: shop, label: "@r9.opt.shop", effects: [{ set: op1, value: shop }, { set: op_done, value: true }, { message: "@r9.after" }] }
      - { id: home, label: "@r9.opt.home", effects: [{ set: op1, value: home }, { set: op_done, value: true }, { message: "@r9.after" }] }
  - id: R9b
    label: Друга група
    prompt: "@r9b.prompt"
    context: "@r9b.context"
    available: { all: [{ flag: op_done }, { hintsAtMost: 3 }] }
    options:
      - { id: tower, label: "@r9.opt.tower", effects: [{ set: op2, value: tower }] }
      - { id: station, label: "@r9.opt.station", effects: [{ set: op2, value: station }] }
      - { id: shop, label: "@r9.opt.shop", effects: [{ set: op2, value: shop }] }
      - { id: home, label: "@r9.opt.home", effects: [{ set: op2, value: home }] }

events:
  # Наслідок Р7-б («згодувати хибну інформацію»): Вейс іде в сховище вночі після шлюзу Б.
  - id: E-TRAP
    at: { afterGate: B }
    requires: { flag: trap_set }
    message: "@etrap.message"
    effects:
      - { set: veis_caught, value: true }
      - { set: killer_alert, value: true }
  - id: E-VEISPHONE
    at: { afterGate: C }
    requires: { flag: veis_caught }
    message: "@eveisphone.message"
    effects:
      - { unlock: C12 }
  - id: E-COURT
    at: { afterGate: D }
    requires: { flag: solomiya_refused }
    message: "@ecourt.message"
    effects:
      - { unlock: C08 }
  - id: E5
    at: { minute: 85 }
    message: "@e5.message"
    decision: R9

codes:
  - { code: 490, action: { task: Z6 } }
  - { code: 407, action: { task: Z8 } }
  - { code: 492, action: { task: Z11 } }

# Звинувачення — після операції; якщо команді доступна друга група, спершу рішення про неї.
accusationOpen: { all: [{ flag: op_done }, { any: [{ flag: op2 }, { not: { hintsAtMost: 3 } }] }] }

accusation:
  - id: killer
    prompt: "@acc.killer"
    answer: prokopchuk
    options:
      - { id: prokopchuk, label: "@person.nelya" }
      - { id: zgurska, label: "@person.marta" }
      - { id: korzh, label: "@person.korzh" }
