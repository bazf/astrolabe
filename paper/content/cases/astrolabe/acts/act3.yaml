# Акт 3 «Годинник бреше». Числа — з tools/solve.mjs: clock.realStop 00:40, shadow.answer 17:10,
# route.leftCentreAt 00:45 / aroundParkMin 22.8, thermos.drunkMg 1.44 / mgPerKg 0.0157.

tasks:
  - id: Z4
    label: З-4
    depts: [K]
    title: "@task.z4.title"
    visibleWhen: { unlocked: "section:B" }
    question: { trainee: "@task.z4.q.trainee", detective: "@task.z4.q.detective" }
    gate: C
    spec:
      trainee: { kind: time, min: "00:35", max: "00:45" }
      detective: { kind: time, min: "00:35", max: "00:45" }
    hints:
      trainee: ["@task.z4.h.trainee.1", "@task.z4.h.trainee.2", "@task.z4.h.trainee.3"]
      detective: ["@task.z4.h.detective.1", "@task.z4.h.detective.2", "@task.z4.h.detective.3"]
  - id: Z5
    label: З-5
    depts: [O]
    title: "@task.z5.title"
    visibleWhen: { unlocked: "section:B" }
    question: { trainee: "@task.z5.q", detective: "@task.z5.q" }
    spec:
      trainee: { kind: time, min: "17:00", max: "17:20" }
      detective: { kind: time, min: "17:00", max: "17:20" }
    hints:
      trainee: ["@task.z5.h.1", "@task.z5.h.trainee.2", "@task.z5.h.trainee.3"]
      detective: ["@task.z5.h.1", "@task.z5.h.detective.2", "@task.z5.h.detective.3"]
    onSolved: "@task.z5.solved"
  - id: Z9
    label: З-9
    depts: [O]
    title: "@task.z9.title"
    visibleWhen: { unlocked: "section:B" }
    question: { trainee: "@task.z9.q.trainee", detective: "@task.z9.q.detective" }
    spec:
      trainee: { kind: number, min: 21, max: 25, step: 1 }
      detective: { kind: time, min: "00:40", max: "00:50" }
    hints:
      trainee: ["@task.z9.h.1", "@task.z9.h.trainee.2", "@task.z9.h.trainee.3"]
      detective: ["@task.z9.h.1", "@task.z9.h.detective.2", "@task.z9.h.detective.3"]
    onSolved: "@task.z9.solved"
  - id: Z10
    label: З-10
    depts: [K]
    title: "@task.z10.title"
    question: { trainee: "@task.z10.q.trainee", detective: "@task.z10.q.detective" }
    visibleWhen: { all: [{ flag: poisoned }, { not: { flag: stepan_dead } }] }
    urgent: true
    spec:
      trainee: { kind: number, min: 1.40, max: 1.48, step: 0.01 }
      detective: { kind: number, min: 0.0150, max: 0.0165, step: 0.0001 }
    hints:
      trainee: ["@task.z10.h.1", "@task.z10.h.trainee.2", "@task.z10.h.trainee.3"]
      detective: ["@task.z10.h.1", "@task.z10.h.detective.2", "@task.z10.h.detective.3"]
    effects:
      - { set: stepan_saved, value: true }
    onSolved: "@task.z10.solved"

gates:
  C: { task: Z4, payload: { message: "@gate.c.message", unlock: ["section:C", "C07"] } }

decisions:
  - id: R4
    label: Р4
    prompt: "@r4.prompt"
    deadlineGate: C
    defaultOption: c
    options:
      - id: a
        label: "@r4.opt.a"
        effects:
          - { set: iryna_public, value: true }
          - { schedule: E-IRYNA, afterMin: 10 }
          - { message: "@r4.after.a" }
      - id: b
        label: "@r4.opt.b"
        effects:
          - { set: iryna_trust, value: true }
          - { unlock: C09 }
          - { message: "@r4.after.b" }
      - id: c
        label: "@r4.opt.c"
        effects:
          - { message: "@r4.after.c" }
  - id: R6
    label: Р6
    prompt: "@r6.prompt"
    deadlineGate: C
    defaultOption: b
    options:
      - id: a
        label: "@r6.opt.a"
        effects:
          - { unlock: C08 }
          - { schedule: E-STORY, afterMin: 15 }
          - { message: "@r6.after.a" }
      - id: b
        label: "@r6.opt.b"
        effects:
          - { set: solomiya_refused, value: true }
          - { message: "@r6.after.b" }
      - id: c
        label: "@r6.opt.c"
        requires: { flag: korzh_ally }
        effects:
          - { unlock: C08 }
          - { set: solomiya_exclusive, value: true }
          - { message: "@r6.after.c" }
  - id: R5
    label: Р5
    prompt: "@r5.prompt"
    deadlineGate: D
    defaultOption: c
    options:
      - id: a
        label: "@r5.opt.a"
        effects:
          - { unlock: C10 }
          - { set: stepan_protected, value: true }
          - { set: killer_alert, value: true }
          - { message: "@r5.after.a" }
      - id: b
        label: "@r5.opt.b"
        effects:
          - { unlock: C10b }
          - { set: killer_alert, value: true }
          - if: { flag: iryna_trust }
            then:
              - { set: stepan_safe, value: true }
              - { message: "@r5.after.b.safe" }
            else:
              - { schedule: E4, afterMin: 8 }
              - { message: "@r5.after.b.risk" }
      - id: c
        label: "@r5.opt.c"
        effects:
          - { schedule: E4, afterMin: 8 }
          - { message: "@r5.after.c" }
      - id: d
        label: "@r5.opt.d"
        requires: { flag: stepan_contacted }
        effects:
          - { set: stepan_fled, value: true }
          - { message: "@r5.after.d" }

events:
  - id: E-R4
    at: { onCode: [313], afterGate: B, plusMin: 6 }
    requires: { unlocked: "section:B" }
    message: "@er4.message"
    decision: R4
  - id: E2
    at: { minute: 40, afterGate: B }
    message: "@e2.message"
    decision: R6
  - id: E3a
    at: { afterGate: C }
    requires: { flag: stepan_contacted }
    message: "@e3.message"
    decision: R5
  - id: E3b
    at: { afterGate: C, plusMin: 3 }
    requires: { not: { flag: stepan_contacted } }
    message: "@e3.message"
    decision: R5
  - id: E-IRYNA
    at: { scheduled: true }
    message: "@eiryna.message"
    effects:
      - { set: iryna_injured, value: true }
  - id: E-STORY
    at: { scheduled: true }
    message: "@estory.message"
    effects:
      - { set: story_published, value: true }
      - { set: bayda_alert, value: true }
      - { set: killer_alert, value: true }
  - id: E4
    at: { scheduled: true }
    message: "@e4.message"
    effects:
      - { set: poisoned, value: true }
      - { unlock: C15 }
      - { schedule: E4-DEAD, afterMin: 6 }
  - id: E4-DEAD
    at: { scheduled: true }
    requires: { not: { flag: stepan_saved } }
    message: "@e4dead.message"
    effects:
      - { set: stepan_dead, value: true }

codes:
  - { code: 305, action: { task: Z5 } }
  - { code: 313, action: { decision: R4 } }
  - { code: 390, action: { task: Z4 } }
  - { code: 391, action: { task: Z5 } }
  - { code: 392, action: { task: Z9 } }
  - { code: 393, action: { task: Z10 } }

