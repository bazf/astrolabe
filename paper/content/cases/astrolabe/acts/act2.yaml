# Акт 2 «Підміна». Додається до case.yaml під час збирання (масиви доповнюються, шлюзи зливаються).
# Числа — з tools/solve.mjs: density.rhoVitrine 8.45, density.goldGramsMissing 302, insurance.declaredEur 1100.

tasks:
  - id: Z3
    label: З-3
    depts: [K, A]
    title: "@task.z3.title"
    visibleWhen: { unlocked: "section:A" }
    question: { trainee: "@task.z3.q.trainee", detective: "@task.z3.q.detective" }
    gate: B
    spec:
      trainee: { kind: number, min: 8.40, max: 8.50, step: 0.01 }
      detective: { kind: number, min: 270, max: 335, step: 1 }
    hints:
      trainee: ["@task.z3.h.trainee.1", "@task.z3.h.trainee.2", "@task.z3.h.trainee.3"]
      detective: ["@task.z3.h.detective.1", "@task.z3.h.detective.2", "@task.z3.h.detective.3"]
  - id: Z7
    label: З-7
    depts: [A]
    title: "@task.z7.title"
    visibleWhen: { unlocked: "section:A" }
    question: { trainee: "@task.z7.q.trainee", detective: "@task.z7.q.detective" }
    unit: €
    optional: true
    spec:
      trainee: { kind: number, min: 1090, max: 1110, step: 1 }
      detective: { kind: number, min: 1090, max: 1110, step: 1 }
    hints:
      trainee: ["@task.z7.h.trainee.1", "@task.z7.h.trainee.2", "@task.z7.h.trainee.3"]
      detective: ["@task.z7.h.detective.1", "@task.z7.h.detective.2", "@task.z7.h.detective.3"]
    onSolved: "@task.z7.solved"

gates:
  B: { task: Z3, payload: { message: "@gate.b.message", unlock: ["section:B"] } }

decisions:
  - id: R3
    label: Р3
    prompt: "@r3.prompt"
    deadlineGate: B
    defaultOption: b
    options:
      - id: a
        label: "@r3.opt.a"
        effects:
          - { set: korzh_detained, value: true }
          - { set: killer_relaxed, value: true }
          - { message: "@r3.after.a" }
      - id: b
        label: "@r3.opt.b"
        effects:
          - { set: swap_hint, value: true }
          - { message: "@r3.after.b" }
      - id: c
        label: "@r3.opt.c"
        requires: { flag: korzh_interviewed }
        effects:
          - { set: swap_hint, value: true }
          - { set: korzh_ally, value: true }
          - { unlock: C-KORZH }
          - { message: "@r3.after.c" }
  - id: R3release
    label: Р3+
    prompt: "@r3release.prompt"
    context: "@r3release.context"
    available: { flag: korzh_detained, equals: true }
    options:
      - id: release
        label: "@r3release.opt"
        effects:
          - { set: korzh_detained, value: false }
          - { set: killer_relaxed, value: false }
          - { set: korzh_released, value: true }
          - { set: swap_hint, value: true }
          - { message: "@r3release.after" }
  - id: R7
    label: Р7
    prompt: "@r7.prompt"
    deadlineGate: B
    defaultOption: c
    options:
      - id: a
        label: "@r7.opt.a"
        effects:
          - { set: dorosh_exposed, value: true }
          - { set: bayda_alert, value: true }
          - { unlock: C13 }
          - { message: "@r7.after.a" }
      - id: b
        label: "@r7.opt.b"
        effects:
          - { set: trap_set, value: true }
          - { message: "@r7.after.b" }
      - id: c
        label: "@r7.opt.c"
        effects:
          - { set: leak, value: true }
          - { message: "@r7.after.c" }

events:
  - id: E-R3
    at: { onCode: [212], afterGate: A, plusMin: 8 }
    requires: { unlocked: "section:A" }
    message: "@er3.message"
    decision: R3
  - id: E-R7
    at: { onCode: [214], afterGate: A, plusMin: 12 }
    requires: { unlocked: "section:A" }
    message: "@er7.message"
    decision: R7

codes:
  - { code: 212, action: { decision: R3 } }
  - { code: 214, action: { decision: R7 } }
  - { code: 290, action: { task: Z3 } }
  - { code: 291, action: { task: Z7 } }

