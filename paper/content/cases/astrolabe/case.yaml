  - { id: 1-07, label: 1-07, title: "@doc.1-07.title", medium: paper, section: start, sheet: 8, dept: K, component: SpecSheet, props: { body: "@doc.1-07.body" } }
  - { id: 1-08, label: 1-08, title: "@doc.1-08.title", medium: paper, section: start, sheet: 7, dept: K, component: SpeedTable, props: { rows: ["@doc.1-08.r1", "@doc.1-08.r2", "@doc.1-08.r3"], note: "@doc.1-08.note" } }
  - { id: 1-09, label: 1-09, title: "@doc.1-09.title", medium: app, open: true, section: start, dept: O, component: Clipping, props: { paper: "@paper.name", date: "@doc.1-09.date", headline: "@doc.1-09.headline", body: "@doc.1-09.body" } }
  - id: 1-10
