  4-10:
    title: Неукладений лист до Соломії
    from: Орест Гайовий
    to: Соломії Тирсі, «Старокамінь Сьогодні»
    body: |-
      Соломіє, ось що я обіцяв.

      Влітку Роман Байда запропонував Марті «виставку у Відні». Оцінку для страхування зробили смішну — менше п'ятдесяти тисяч, щоб не потрібна була експертиза Мінкульту. У Відні «партнер» Вейс мав передати астролябію покупцеві, а «загублену» копію списали б як нещасний випадок у дорозі.

      Я їм цього не дам. Оригінал у безпеці, де саме — знає лише записник і моя Іра.

      І ще. Гроші музею два роки йдуть у «Реставр-Поділля» — фірму родини Вейса — за реставрації, яких не було. Хтось усередині підписує. Перевірю після свята й тоді віддам тобі все.

      О.
    signature: (не підписано, не надіслано)
  4-11:
    title: Фото з сейфа, 1974
    caption: «Субота, 16 листопада 1974. Тато привів мене до вітрини з астролябією. Того дня я вирішив, ким буду». Чорно-біле фото, на звороті — рука Ореста.
  C12:
    title: Телефон Вейса
    body: |-
      Кіберполіція розблокувала телефон А. Л. Вейса. Листування, вересень 2026:

      Байда → Вейс, 03.09: «Покупець підтвердив. Завдаток на рахунку. Відень — 5 жовтня».
      Вейс → Н.П., 07.09: «Ну що, зважили?»
      Н.П. → Вейс, 07.09: «Це копія. Оригіналу у вітрині нема. Це Орест».
      Вейс → Н.П., 12.09: «Покупець не чекатиме. Дізнайся, де він. Інакше наші реставрації побачить поліція».
      Н.П. → Вейс, 13.09, 01:12: «Він не сказав».

      Номер «Н.П.» — +380 97 314 08 52.
  C14:
    title: Заява Марти Згурської
    body: |-
      М. І. Згурська (угода зі слідством, статус свідка):

      «"Відень" придумав Роман Байда. Він сказав: музей отримає фасад, я — закритий кредит, а місто — славу. Оцінку для страховки диктував він. Платіж зробив його фонд. Покупця знайшов Вейс.

      Я не знала, що Орест підмінив астролябію. І я не знала, що Неля працює на Вейса. Про "Реставр-Поділля" — клянуся, не знала».

task:
  z6:
    title: Касова книга
    q:
      trainee: Скільки музей сплатив ТОВ «Реставр-Поділля» за 2026 рік (січень–серпень)?
      detective: Скільки музей сплатив ТОВ «Реставр-Поділля» за весь час, з січня 2024 до серпня 2026?
    h:
      trainee:
        "1": Кейтеринг Згурської — лише верхівка (+15 %). Подивіться на платежі «Реставр-Поділля» і на те, хто їх підписує.
        "2": Кожен місяць — на 250 грн більше. Додайте вісім платежів 2026 року.
        "3": "(12 000 + 13 750) × 8 ÷ 2 = 103 000 грн. Робіт у журналі реставрацій немає. Підписувала лише Прокопчук; засновник фірми — Вейс."
      detective:
        "1": Три рядки — це арифметична прогресія. Знайдіть крок.
        "2": Від 01.2024 до 03.2025 — 14 кроків, сума виросла на 3 500 → крок 250. Усього 32 платежі.
        "3": "(6 000 + 13 750) × 32 ÷ 2 = 316 000 грн."
    solved: |-
      Фіктивні реставрації: робіт немає, підписувала лише Прокопчук, гроші йшли фірмі Вейса.

      Орест у листі писав «хтось усередині підписує». Тепер ви знаєте, хто.
  z8:
    title: Сейф Ореста
    q:
      trainee: Введіть код сейфа (4 цифри).
      detective: Введіть код сейфа (6 цифр, ДДММРР).
    h:
      trainee:
        "1": Затерті кнопки — 1, 4, 6, 7. Кожна вжита один раз — це 24 варіанти.
        "2": «Рік, з якого все почалося» — рік астролябії. Подивіться на інвентарну картку 2-02.
        "3": Пляма закриває третю цифру року — «16_7». З цифр 1, 4, 6, 7 підходить лише одна.
      detective:
        "1": "Шість цифр ДДММРР лише з 1, 4, 6, 7, кожна хоч раз. Місяць може бути тільки 11."
        "2": "Кандидатів шість: 14.11.1967, 14.11.1976, 16.11.1947, 16.11.1974, 17.11.1946, 17.11.1964. «Моя субота»."
        "3": "Субота лише 16.11.1974 — код 161174."
  z11:
    title: Шифр записника
    q:
      trainee: Розшифруйте сторінку записника. За яким циферблатом вежі ніша — північним, південним, східним чи західним?
      detective: Розшифруйте сторінку записника. Що стоїть у тому місці, на яке вказує запис?
    h:
      trainee:
        "1": Ключ — висота Полярної зірки над містом. Вона дорівнює широті.
        "2": Широта на полях карти 1-12 — 49°. В абетці 33 літери, тож зсув — 49 − 33 = 16. Поверніть диск на 16 літер назад.
        "3": «ВЕЖА ЗА ПІВДЕННИМ ЦИФЕРБЛАТОМ НІША ПІД МЕХАНІЗМОМ ВІДБОЮ».
      detective:
        "1": Перше слово зсунуте на широту міста (49 − 33 = 16), кожне наступне — на 1 більше.
        "2": «ВІД ДВЕРЕЙ МУЗЕЮ АЗИМУТ СОРОК ШІСТДЕСЯТ МЕТРІВ НІША ЗА ЦИФЕРБЛАТОМ». Тепер — план Ринку 1-13.
        "3": "40° і 60 м від дверей музею — годинникова вежа. Каплиця — 40°, але 120 м; сонячний годинник і криниця — 60 м, але 15° і 70°."
    solved: |-
      Оригінал — у вежі, у ніші за південним циферблатом, за кілька метрів від галереї, з якої впав Орест.

      Оперативна група чекає наказу. Вирішуйте, куди її відправити.

gate:
