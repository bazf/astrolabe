rsafe:
  prompt: Отримати ордер і викликати слюсаря для сейфа?
  context: Сейф у кабінеті Ореста замкнений на кодовий замок. Прокурор може дати ордер — тоді слюсар зніме код із контролера, але оформлення забере час.
  opt: Отримати ордер (−10 хвилин)
  after:
    trainee: "Слюсар зняв журнал коду з контролера: остання правильна комбінація — 1647. Введіть її, і сейф відчиниться."
    detective: "Слюсар зняв журнал коду з контролера: остання правильна комбінація — 161174. Введіть її, і сейф відчиниться."

r8:
  prompt: Що запропонувати Марті Згурській?
  context: Марта Згурська нервує дедалі більше. Вона підписувала папери для «Відня» і знає, хто стоїть за схемою. Її адвокат натякає, що директорка готова говорити — якщо їй щось запропонують.
  opt:
    a: Угода — свідчення проти Байди в обмін на статус свідка
    b: Повідомити про підозру в шахрайстві
    c: Не чіпати
  after:
    a: Згурська підписує угоду. Її заява — в архіві. Через рік вона очолить музей в іншому місті.
    b: Згурська мовчить з адвокатом. Схему доведеться доводити іншими доказами.
    c: Згурська йде додому. Її роль у «Відні» лишається поза справою.

r9:
  prompt: Куди відправити оперативну групу?
  context: Оперативна група одна, адрес — чотири. Куди вона поїде, там і буде розв'язка.
  opt:
    tower: Годинникова вежа
    station: Вокзал — останній потяг до кордону о 21:40
    shop: Крамниця «Старожитності», Замкова, 7
    home: Дім Прокопчук, Садова, 14
  after: Група виїхала. Що вона знайде на адресі, ви дізнаєтеся в епілозі. Тепер — звинувачення.

r9b:
  prompt: Куди відправити другу групу?
  context: Ви взяли не більше трьох підказок — прокурор дає ще одну оперативну групу.

