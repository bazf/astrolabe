sheet4:
  intro:
    trainee: Конверт В — касова книга, обшук бухгалтерії, кабінет Гайового. Код сейфа (АС-407) відчиняє конверт Г; там — шифр (АС-492). Касова книга — АС-490.
    detective: Касова книга — АС-490, сейф — АС-407 (відчиняє конверт Г), шифр — АС-492.
  data:
    trainee: |-
      Сума однакових кроків: (перший + останній) × кількість ÷ 2.
      В абетці 33 літери. Шифрувальний диск — П-03.
    detective: |-
      Арифметична прогресія: aₙ = a₁ + (n − 1)d.
      В абетці 33 літери. Азимут — від півночі за годинниковою стрілкою.

