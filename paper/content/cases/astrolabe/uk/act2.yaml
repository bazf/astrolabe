      Предмет: астролябія з вітрини № 3 Старокамінського краєзнавчого музею.

      Маса: 2 628 г (ваги лабораторні ВЛ-5000, похибка ±1 г).
      Об'єм: 311 см³ (метод гідростатичного витіснення, дистильована вода, 20 °C).

      Зовнішній огляд: гравіювання шкал спрощене; на зворотному боці «материнської» пластини — клеймо «К-2009».

      Висновки щодо складу металу — за запитом слідства.
