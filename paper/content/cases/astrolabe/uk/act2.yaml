doc:
  2-01:
    title: Заява директорки музею
    from: Директорка Старокамінського краєзнавчого музею М. І. Згурська
    to: Старокамінський районний відділ поліції
    body: |-
      13 вересня 2026 р., 11:20.

      Повідомляю, що сьогодні під час огляду головної вітрини зали № 3 працівниця музею звернула мою увагу на те, що гравіювання на астролябії (інв. № КН-1147) виглядає спрощеним, а позолота — тьмяною.

      Не виключаю, що у вітрині — не оригінал, а копія, виготовлена 2009 р. для пересувних виставок, яка має зберігатися у сховищі фондів.

      Прошу провести експертизу предмета. Нагадую, що 5 жовтня астролябія має виїхати на виставку до Відня.
    signature: М. Згурська
  2-02:
    title: Інвентарна картка КН-1147
    name: Астролябія планісферна
    k:
      author: Автор, рік
      material: Матеріал
      size: Розмір
      mass: Маса
      volume: Об'єм
      received: Надходження
    v:
      author: невідомий майстер, львівська майстерня
      material: латунь, позолота; золоті вставки (лімб, «павук»)
      volume: 316 см³ (гідростатичне зважування, обмір 1998 р.)
      received: 1958 р., дар родини Кульчицьких
    checks: "Звірено: 03.03.2025 — Гайовий. Звірено: 25.08.2026 — Гайовий (підпис)."
  2-03:
    title: Паспорт копії 2009 р.
    header: |-
      ПАСПОРТ ВИРОБУ
      Копія астролябії КН-1147 для пересувних виставок
    body: |-
      Виконавець: реставратор Д. О. Корж, приватна майстерня, м. Старокамінь.
      Рік виготовлення: 2009.
      Матеріал: латунь ЛС59-1, патинування, імітаційна позолота (без дорогоцінних металів).
      Розміри: відповідають оригіналу (Ø 182 мм).
      Гравіювання: спрощене, шкали нанесено за фотографіями.
      Маркування: клеймо «К-2009» на зворотному боці «материнської» пластини.

      Місце зберігання: сховище фондів, стелаж 4, ящик 12.
    signature: Д. Корж; прийняв — О. Гайовий
  2-04:
    title: Акт лабораторного дослідження
