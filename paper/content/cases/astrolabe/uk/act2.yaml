  2-14:
    title: Вирізка «Фонд Байди оплатив навчання»
    date: 2 вересня 2026
    headline: Фонд Байди оплатив навчання 12 студентам
    body: |-
      БФ «Відродження Старокаменя» депутата Романа Байди третій рік поспіль оплачує контрактне навчання молоді міста. Цьогоріч стипендії отримали:

      Ганна Бойко (ЛНУ), Максим Дорош (КНЕУ), Олег Іваськів (КПІ), Софія Кравець (ЧНУ), Дмитро Лисак (ЛП), Вероніка Мельник (ХНУ), Тарас Олійник (ЛП), Юлія Петрук (КНУ), Андрій Савчин (ТНТУ), Ірина Ткачук (ЛНУ), Богдан Чорний (КПІ), Олена Шевчук (НаУКМА).

      «Місто має пам'ятати, хто йому допомагає», — сказав Роман Байда.
    codeCaption: Сержант Дорош напрошується допомагати
  2-15:
    title: Аркуш слідчого № 2
  C-KORZH:
    title: Консультація Коржа
    body: |-
      Давид Корж, реставратор, — неофіційно:

      «Копію я лив з латуні ЛС59 — густина в неї така, як у звичайної латуні.

      Оригінал важчий, хоч на вигляд такий самий. Лімб і "павук" там із золотими вставками, а золото майже вдвічі важче за латунь. Візьміть масу й об'єм оригіналу з картки, порахуйте густину — і все побачите.

      І ще. На моїй копії ззаду клеймо "К-2009". Подивіться, що написано в акті лабораторії».
  C13:
    title: Пояснення сержанта Дороша
    body: |-
      Пояснення сержанта К. В. Дороша (записано після відсторонення):

      «О 06:12 я був на площі. Подзвонив Роману Степановичу — він просив повідомляти про все, що стосується музею. Він сказав: "Клим, не роби з цього цирку. Старий послизнувся, поручні гнилі — так і пиши".

      Я написав 1,2 метра. Насправді не міряв. Поручні знизу не роздивишся.

      Фонд Романа Степановича платить за навчання мого сина. Я не думав, що це важливо».

      Білінг службового телефону: 13.09.2026, 06:20, вихідний на номер Р. С. Байди, 3 хв 12 с.

task:
  z3:
    title: Оригінал чи копія?
    q:
      trainee: Яка густина предмета з вітрини? Відповідь — у г/см³, з двома знаками після коми.
      detective: Скільки грамів золота бракує предмету з вітрини порівняно з оригіналом?
    h:
      trainee:
        "1": Порівняйте предмет з вітрини з оригіналом за інвентарною карткою. Важить не лише маса.
        "2": Густина = маса ÷ об'єм. Маса й об'єм предмета з вітрини — в акті лабораторії 2-04, оригіналу — на картці 2-02.
        "3": 2 628 ÷ 311 ≈ 8,45 г/см³ — звичайна латунь. В оригіналу 2 840 ÷ 316 ≈ 8,99. У вітрині копія.
      detective:
        "1": Оригінал важчий за будь-яку латунь. Чому?
        "2": Частину оригіналу займає золото (19,3 г/см³), решту — латунь (8,45 г/см³). Для суміші 1/ρ = w/19,3 + (1 − w)/8,45, де w — частка золота за масою.
        "3": ρ = 2 840 ÷ 316 ≈ 8,99; w ≈ 0,106; 0,106 × 2 840 ≈ 302 г. У копії золота немає.
  z7:
    title: Скільки «коштує» астролябія?
    q:
      trainee: Яку вартість у євро задекларували для страхування?
      detective: Яку вартість у євро задекларували для страхування? Суму в договорі не видно — відновіть її.
    h:
      trainee:
        "1": Порівняйте страхову суму з порогом експертизи й з ціною схожої астролябії на аукціоні.
        "2": Гривні в євро — за курсом НБУ з витягу 2-10.
        "3": 49 720 ÷ 45,20 = 1 100 €. Аналог продано за 1 150 000 € — у тисячу разів дорожче.
      detective:
        "1": Премія — це відсоток від страхової суми.
        "2": Страхова сума = премія ÷ тариф. Тариф 0,6 % = 0,006.
        "3": 298,32 ÷ 0,006 = 49 720 грн; 49 720 ÷ 45,20 = 1 100 €.
    solved: |-
      1 100 € — менше за поріг експертизи на 280 грн. Предмет у договорі названо «копією XIX ст.». Оцінку підігнали так, щоб астролябію можна було вивезти без висновку Мінкульту.

      Премію сплатив фонд Байди.

gate:
  b:
    message: |-
      Густина предмета з вітрини — 8,45 г/см³. Це звичайна латунь, а не позолочений оригінал. У вітрині — копія 2009 року з клеймом «К-2009».

      Але офіційний акт 7 вересня каже: 2 840 г, тобто оригінал. Тоді підміна сталася після 7 вересня?

      Відкрийте конверт Б.

er3:
  message: |-
    Дзвонить прокурор Головач:

    «Відбитки Коржа на копії. Фото — він біля вежі в хвилину смерті. Мотив знайдемо. Затримуйте, поки не втік».

er7:
  message: |-
    До відділу заходить сержант Дорош — у цивільному, з кавою для всіх:

    «Можу допомогти зі свідками. Я ж тут кожного знаю». Він ще не знає, що ви бачили фото криміналістів.

r3:
  prompt: Що робити з реставратором Коржем?
  opt:
    a: Затримати Коржа
    b: Відпустити під підписку про невиїзд
    c: Залучити Коржа як консультанта
  after:
    a: Коржа затримано на 72 години. Він мовчить і вимагає адвоката. Місто видихнуло, прокурор задоволений.
    b: |-
      Корж, виходячи, зупиняється у дверях:

      «29 серпня Орест попросив мене принести копію зі сховища. І нікому не казати. Я думав, він хоче її сфотографувати. Тепер не знаю, що думати».
    c: |-
      Корж погоджується допомогти з металом. І додає:

      «29 серпня Орест попросив мене принести копію зі сховища. І нікому не казати. Тепер я, здається, розумію навіщо».

      Його консультацію додано в архів.

r3release:
  prompt: Звільнити Давида Коржа з-під варти?
  context: Давид Корж під вартою. Проти нього — лише відбитки на копії та фото біля дверей вежі о 22:09. Адвокат вимагає або обвинувачення, або волі.
  opt: Звільнити Коржа
  after: |-
    Коржа звільнено. На порозі він каже: «29 серпня Орест попросив мене принести копію зі сховища. Тепер ви знаєте все, що знаю я».

r7:
  prompt: Що робити з сержантом Дорошем?
  opt:
    a: Викрити — протокол сфальсифіковано
    b: Згодувати йому хибну інформацію
    c: Не чіпати — нехай допомагає
  after:
    a: Дороша відсторонено до службового розслідування. Його пояснення — в архіві. Байда, кажуть, уже телефонує своєму адвокату.
    b: Ви між іншим кажете при ньому, що справжню астролябію знайшли у сховищі фондів і вранці везете до Києва. Дорош киває й надто поспішно йде.
    c: Дорош допомагає зі списками свідків. Корисно. Він чує все, що обговорює група.

sheet2:
  intro:
    trainee: Музей заявив про можливу підміну астролябії. Перевірте, що стоїть у вітрині. Відповідь на З-3 — у застосунку (АС-290). З-7 — за бажанням (АС-291).
    detective: Перевірте, що стоїть у вітрині, і порахуйте, чого бракує. З-3 — АС-290, З-7 — за бажанням, АС-291.
  data:
    trainee: |-
      Густина = маса ÷ об'єм.
      Густини металів, г/см³: латунь — 8,4–8,7; бронза — 8,7–8,9; мідь — 8,96; срібло — 10,5; золото — 19,3.
      Гривні → євро: поділіть на курс НБУ.
    detective: |-
      Густини металів, г/см³: латунь — 8,45 (ЛС59); бронза — 8,7–8,9; мідь — 8,96; срібло — 10,5; золото — 19,3.
      Для суміші двох металів за масою: 1/ρ = w₁/ρ₁ + w₂/ρ₂.

