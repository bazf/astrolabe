      Лондон. На торгах аукціонного дому «Ламберт і сини» латунна астролябія з позолотою, виготовлена 1652 року в Гданську, продана анонімному покупцеві за 1 150 000 €.

      За словами експертів, інструменти XVII століття такого збереження на ринку з'являються раз на кілька років. Ціну визначили позолочений лімб і золоті вставки.
