  3-02:
    title: Протокол огляду годинникового механізму
    header: |-
      ПРОТОКОЛ
      огляду годинникового механізму вежі
      13 вересня 2026 р., 07:50–08:40
    body: |-
      Огляд проведено за участі міського годинникаря Л. Й. Барвінка.

      Стрілки всіх чотирьох циферблатів показують 22:10. Маятник нерухомий. На диску маятника — свіжі відбитки пальців у пилу та подряпини, характерні для зупинки рукою. На осі стрілок — сліди перекручування.

      Гиря ходу опустилася на 0,80 м від верхньої позначки.
      Гиря бою опустилася на 0,96 м від верхньої позначки.

      Барвінок: «Цей годинник сам не стає. Хтось спинив маятник рукою і перевів стрілки».
    signature: Слідча О. Крук · Л. Барвінок
  3-03:
