  C08:
    title: Сирий запис Соломії Тирси
    body: |-
      Запис з телефона журналістки (не публікувався). Трансляція обірвалася о 23:58, телефон писав далі.

      23:58:40 — у кадрі вежа, циферблат освітлений. На площі Ринок майже нікого: з Замкової чути концерт.
      00:00:00 — годинник на вежі б'є. Дванадцять ударів, чисто чутно між піснями.
      00:04 — Соломія записує стендап на тлі вежі.
      00:10 — запис закінчується.

      Висновок очевидний: опівночі годинник іще йшов.
  C09:
    title: Телефон Ірини Гайової
    body: |-
      Месенджер, 13.09, 00:31, від «Дядько Орест»:

      «Іро, якщо зі мною щось станеться — ключ у тебе. Не довіряй нікому з музею».

      Вкладення — фото аркуша з написом рукою Ореста: «Полярна над нашим містом».

      Ірина: «Він усе життя шифрував мені записки — з дитинства. Ключ — це висота Полярної зірки. А ще він казав, що його найважливіша субота — пароль до всього. Я не знаю, що це значить».
  C10:
    title: Свідчення Лугового
    body: |-
      С. П. Луговий (під охороною):

      «О 00:39 вийшов чорним ходом покурити. Дощ. Хвилини за три з вежі вийшла жінка в жовтому волонтерському дощовику, присіла біля стіни, над чимось схилилась. Ліхтар світив їй в обличчя. Це була Прокопчук. Я її двадцять разів на день бачу.

      Поліцію не викликав. Хотів… грошей. Написав їй уранці».

      Прокурор Головач: «Свідок-шантажист. Суд йому не повірить, доки не буде решти. Збирайте докази — арешт лише з повною картиною».
  C10b:
    title: Запис зустрічі Лугового з Прокопчук
    body: |-
      Диктофон у кишені Лугового. Парк, лавка біля фонтану.

      Луговий: «Ти знаєш, що я бачив».
      Прокопчук: «Ти нічого не бачив, Степане. Дощ, темно».
      Луговий: «Жовтий дощовик. За чверть до першої. Біля стіни».
      Прокопчук (після паузи): «Скільки?»
      Луговий: «П'ятдесят».
      Прокопчук: «Чаю будеш? Я принесла термос. Змерз, певно».

      Пізніше Прокопчук пояснить: «Він мене шантажував. Я принесла гроші, щоб він відчепився. Нікого я не вбивала».
  C15:
    title: Дані токсиколога
    header: |-
      Лікарня швидкої допомоги, реанімація
      ЗАПИТ ТОКСИКОЛОГА ДО СЛІДСТВА
    body: |-
      Пацієнт: Луговий С. П., 92 кг. Знайдено біля музею без тями. Поруч — термос.

      Знайдено: блістер «Гіпотензилу» (препарат матері Н. В. Прокопчук) — бракує 12 таблеток по 0,15 мг. Термос на 0,5 л, у ньому лишилося 0,1 л чаю.

      Довідка (ігрові пороги): ≥ 0,008 мг/кг — отруєння середнього ступеня; ≥ 0,012 мг/кг — тяжке, потрібен антидот.

      Нам потрібна доза негайно. У вас шість хвилин.
    signature: Лікар-токсиколог М. Гнатюк

task:
  z4:
    title: Справжній час зупинки
    q:
      trainee: О котрій годині насправді зупинився годинник на вежі?
      detective: О котрій годині насправді зупинився годинник? Швидкості гир у журналі ніхто не вказав — виведіть самі.
    h:
      trainee:
        "1": Гирі опускаються, лише поки годинник іде. На скільки опустилася гиря ходу до ранку?
        "2": "Журнал: 12 см за годину від заводу о 18:00. Протокол огляду: гиря ходу — 0,80 м."
        "3": 0,80 ÷ 0,12 = 6 год 40 хв після 18:00 — це 00:40. Не 22:10.
      detective:
        "1": Швидкість гир виведіть із журналу — завод і контрольний огляд наступного ранку.
        "2": Гиря ходу — 1,86 м за 15,5 год, тобто 0,12 м/год. Гиря бою опускається лише під час ударів; з 18:00 до 9:30 їх 118, тобто 1,5 см на удар.
        "3": "Хід: 0,80 ÷ 0,12 = 6 год 40 хв → 00:40. Бій: 0,96 ÷ 0,015 = 64 удари — годинник бив і опівночі, і о пів на першу. До 22:10 було б лише 38."
  z5:
    title: Коли знято фото Тимура?
    q: О котрій приблизно годині знято фото Тимура біля дверей вежі?
    h:
      "1": Тінь показує, як високо стоїть Сонце. Порівняйте довжину тіні з висотою ліхтаря — і зверніть увагу, куди вона падає.
      trainee:
        "2": "Тінь — 28 плиток × 0,4 м = 11,2 м; ліхтар — 4,5 м; відношення 2,49. Тінь падає на схід, тож Сонце на заході — це після полудня."
        "3": Після полудня 2,49 — між 17:10 (2,44) і 17:20 (2,64), ближче до 17:10. Не 10:00, як каже Прокопчук (тоді було б 1,73).
      detective:
        "2": tg α = 4,5 ÷ 11,2. Тінь падає на схід — отже, після полудня.
        "3": α ≈ 21,9°. За таблицею після полудня — близько 17:10. О 10:00 Сонце було б на 30°.
    solved: |-
      Прокопчук стояла біля дверей вежі близько 17:10, а не «вранці, о десятій». Камера над дверима не працює з серпня — вона це перевіряла?

      Навіщо їй брехати про таку дрібницю?
  z9:
    title: Дорога додому
    q:
      trainee: Скільки хвилин іти від вежі до дому Прокопчук (Садова, 14) в обхід парку зі швидкістю 5 км/год?
      detective: О котрій Прокопчук вийшла з центру, якщо сусідка чула її двері о 01:08?
    h:
      "1": Парк відчинено до 24:00 — після півночі додому лише в обхід.
      trainee:
        "2": Виміряйте маршрут вулицями Паркова й Садова на карті 1-12 — близько 19 см, тобто 1,9 км.
        "3": 1,9 км ÷ 5 км/год ≈ 23 хв. Двері гримнули о 01:08 — отже, вона вийшла з центру близько 00:45, а не о 23:40.
      detective:
        "2": Через парк — 1,3 км, в обхід — 1,9 км. О 23:40 вона була б удома о 23:56. Сусідка ж чула двері о 01:08.
        "3": 1,9 ÷ 5 × 60 ≈ 23 хв; 01:08 − 0:23 = 00:45.
    solved: Прокопчук вийшла з центру близько 00:45, а не о 23:40. Що вона робила біля Ринку після опівночі?
  z10:
    title: Доза для реанімації
    q:
      trainee: Скільки міліграмів «Гіпотензилу» отримав Луговий?
      detective: Яку дозу на кілограм маси отримав Луговий (мг/кг)?
    h:
      "1": Скільки препарату було в термосі і яку частину чаю він випив?
      trainee:
        "2": 12 таблеток × 0,15 мг = 1,8 мг на 0,5 л чаю. Лишилося 0,1 л.
        "3": Випив 0,4 л з 0,5 л, тобто 1,8 × 0,8 = 1,44 мг.
      detective:
        "2": 1,8 мг на 0,5 л; випито 0,4 л — і поділіть на 92 кг.
        "3": 1,44 ÷ 92 ≈ 0,0157 мг/кг — тяжке отруєння.
    solved: Лікарі ввели антидот вчасно. Луговий житиме. Блістер — з ліків матері Прокопчук.

gate:
  c:
    message: |-
      Годинник зупинили о 00:40 і перевели стрілки на 22:10. Гирі не брешуть.

      Усі алібі «на 22:10» нічого не варті. Корж біля вежі о 22:10 — не вбивця, а пастка, в яку вас вели. О 22:10 найкраще алібі в місті мав той, хто був на сцені перед сотнями свідків. Згадайте, хто там стояв.

      Кіберполіція передала білінг телефону Гайового (Ц-07): о 23:58 йому хтось дзвонив, о 00:31 він ще був живий.

      Відкрийте конверт В.

er4:
  message: |-
    Ірина Гайова сидить у коридорі відділу з адвокатом. Вона нічого не підписує і дивиться крізь вас.

    «Дядько казав: не довіряй нікому з музею. Ви теж із ними?»

e2:
  message: |-
    Дзвонить Соломія Тирса, журналістка «Старокамінь Сьогодні»:

    «У мене є запис тієї ночі біля вежі, який не пішов в ефір. Думаю, вам він дуже потрібен. Дам — якщо дозволите опублікувати матеріал сьогодні ввечері».

e3:
  message: |-
    Дзвонить охоронець Луговий. Голос тремтить:

    «Я дещо бачив тієї ночі. Але мені потрібні гарантії. Я не хочу закінчити, як Гайовий».

eiryna:
  message: Квартиру Гайового, де жила Ірина, зламали. Ірина з травмою голови в лікарні. Злодій шукав щось у папірцях і на її телефоні.

estory:
  message: |-
    «Старокамінь Сьогодні»: «ГОДИННИК НА ВЕЖІ БИВ ОПІВНОЧІ: смерть зберігача — не нещасний випадок».

    Місто гуде. Байда скасував усі зустрічі. Згурська не бере слухавку.

e4:
  message: |-
    Лугового знайшли без тями біля музею. Поруч термос. Його везуть у реанімацію.

    Токсиколог просить дозу — дані в архіві (Ц-15), завдання З-10. У вас шість хвилин.

e4dead:
  message: Лікарі не встигли. Степан Луговий помер у реанімації. Свідок, який бачив убивцю, мовчатиме назавжди.

r4:
  prompt: Як поводитися з Іриною Гайовою?
  opt:
    a: Тиснути — спадкоємиця, мотив, без алібі
    b: Показати їй інвентарну картку й копію, заслужити довіру
    c: Не чіпати
  after:
    a: Ірина мовчить з адвокатом. Увечері вона публікує допис «Поліція звинувачує мене, а не тих, кого боявся дядько». Допис набирає тисячі переглядів.
    b: Ірина довго дивиться на картку й фото копії. Потім дістає телефон. «Він знав, що з ним щось станеться». Її листування — в архіві.
    c: Ірина йде з адвокатом. Ви не тиснете — і нічого не отримуєте.

r6:
  prompt: Що відповісти Соломії Тирсі?
  opt:
    a: Погодитись — запис зараз, публікація сьогодні
    b: Відмовити — запис через суд
    c: Запропонувати ексклюзив після арешту
  after:
    a: Соломія надсилає запис (в архіві). «Матеріал вийде за чверть години».
    b: «Як хочете. Тоді — через суд». Запис отримаєте лише з ухвалою, не раніше фіналу.
    c: "Соломія вагається, потім каже: «Давид Корж за вас ручається. Добре — ексклюзив після арешту». Запис — в архіві."

r5:
  prompt: Що робити з Луговим?
  opt:
    a: Взяти під охорону зараз
    b: Хай іде на зустріч із тим, кого бачив, — з диктофоном
    c: Відкласти розмову до завтра
    d: Сказати йому, що його бачили, і попередити
  after:
    a: Лугового забрали під охорону. Його свідчення — в архіві. Прокурор арешту не дає — «збирайте решту». Хтось у музеї вже помітив, що Луговий зник.
    b:
      safe: |-
        Ірина, почувши про зустріч, каже одне: «Хай нічого не їсть і не п'є з чужих рук. Так і труять». Луговий повертається живий, з записом (в архіві). Прокопчук тепер знає, що її шантажували не самі.
      risk: Луговий іде на зустріч з диктофоном, без прикриття — єдину групу бережуть на фінал. Запис (в архіві) обривається на словах про термос.
    c: Луговий кладе слухавку. «Завтра може бути пізно», — встигає сказати він.
    d: Луговий бліде, сідає в перший автобус і зникає з міста. Живий. Свідчити не буде.

