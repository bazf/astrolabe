      ВИСНОВОК № 417/26 (остаточний)
    body: |-
      Причина смерті: тупа поєднана травма голови й грудної клітки внаслідок падіння з висоти.

      Під час огляду на місці (07:30) встановлено: бруківка під тілом мокра, як і навколо; одяг на спині промоклий рівномірно. Тіло пролежало на бруківці під дощем.

      Час смерті за станом тіла: між 21:30 і 02:30. Слідів алкоголю в крові немає.
    signature: Ю. О. Стицько
  C07:
    title: Білінг телефону Гайового
    intro: "Ухвала слідчого судді. Оператор надав дані про з'єднання номера +380 67 *** 41 19 і хмарну копію пошти. Сам телефон не знайдено."
    c:
      time: Час
      type: Тип
