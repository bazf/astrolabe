  3-07:
    title: Письмові пояснення свідків
    body: |-
      Згурська М. І.: «Увечері 12.09 була на банкеті й у музеї, розмовляла із загиблим про роботу. Додому поїхала таксі десь о чверть на першу. Більше нічого не пам'ятаю».

      Прокопчук Н. В.: «Удень була вдома з мамою. Біля вежі того дня проходила лише вранці, близько десятої, коли ставили намети. О 21:55–22:15 — на сцені, о 23:40 пішла додому через парк. Спала».

      Луговий С. П.: «Чергував. Дивився футбол. Нічого не чув. У дощ на площі нікого не було».

      Корж Д. О.: «О 22:05–22:20 чекав Гайового біля вежі на його прохання (SMS о 21:43). Він не прийшов. О 22:38 був у майстерні».
  3-08:
    title: Показання сусідки Прокопчук
    body: |-
      Ліщук Ганна Миколаївна, 74 роки, вул. Садова, 14, кв. 2:

      «У нас стіни як папір. Неля з мамою за стіною. Того вечора я дивилася серіал до кінця — серія скінчилася о 01:08, і якраз тоді в Нелі гримнули двері, я ще подумала: от гуляє. До того в них була тиша, телевізор у матері не вмикався, а Неля завжди вмикає, коли вдома».
  3-09:
    title: Журнал сигналізації музею
    intro: Пульт охорони. Фіксуються постановка, зняття й відчинення дверей.
    c:
