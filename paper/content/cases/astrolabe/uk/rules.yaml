# Правила гри для гравців і організатора — без спойлерів: жодних імен винних, відповідей і поворотів сюжету.
rules:
  title: Як грати
  intro: |-
    «Справа № 17. Астролябія» — детективна гра для 2–20 гравців від 16 років. Ви — слідча група поліції містечка Старокамінь: у ніч Дня міста під годинниковою вежею знайшли мертвим головного зберігача музею. Докази лежать на папері в конвертах і в застосунку-компаньйоні, а керує групою слідча Олена Крук — її голос у застосунку.

    Партія триває 90 хвилин (або 60 у скороченому варіанті). Мета — з'ясувати, що сталося, ухвалити рішення, з якими доведеться жити, і наприкінці назвати винних. Готової відповіді «правильно / неправильно» немає: від ваших рішень залежить, чим закінчиться справа для кожного з героїв.
  need:
    title: Що потрібно
    body: |-
      — Комплект на команду: 24 аркуші А4 і 5 конвертів (друкує й готує ведучий).
      — Хоча б один телефон, планшет чи ноутбук на команду; можна більше — див. «Кілька телефонів».
      — Лінійка, калькулятор, ручки. Писати на документах можна й потрібно.
      — Ведучий із посібником ведучого (у ньому розгадка — гравцям його не показують).

      Інтернет потрібен лише, щоб уперше відкрити застосунок. Далі він працює без мережі.
  kit:
    title: Комплект
    body: |-
      — Папка: обкладинка з QR і кодом АС-000, картка правил, лист слідчої Крук, шифрувальний диск. Лежить на столі з самого початку.
      — Стартовий конверт «Докази» — відкривайте одразу.
      — Конверти А, Б і В — лише тоді, коли застосунок скаже «Відкрийте конверт …». Ведучий видає їх на вимогу.
      — Конверт Г вкладено в конверт В — він має свою умову; не відкривайте його раніше.

      Усередині — протоколи, фото, карти й плани з масштабом, картки фігурантів і «Аркуші слідчого» з завданнями до кожного акту. Значки К, А, О в кутах документів потрібні лише для режиму «Відділи».
  app:
    title: Застосунок
    body: |-
      Відкрийте застосунок за QR на обкладинці або введіть його адресу, назвіть команду й оберіть рівень. Унизу — п'ять вкладок:

      — Справа — головний екран: завдання, рішення, повідомлення слідчої, нагадування про допити.
      — Код — сюди вводять коди АС-### з документів (великі чи малі літери, з дефісом чи без — неважливо).
      — QR — те саме, що й код, тільки камерою.
      — Архів — цифрові документи справи: журнали, листування, кадри камер. Нові розділи відкриваються разом із конвертами.
      — База — поліцейська база даних. З'являється пізніше; шукає лише за точним запитом: прізвище, номер авто, телефон чи назва компанії.

      Угорі — таймер (хвилини гри разом зі штрафами). Під ним смуга з тим, що не можна проґавити: рішення, які чекають на вас, і термінові завдання.
  play:
    title: Хід розслідування
    body: |-
      Справа поділена на чотири акти. Кожен закінчується ключовим завданням — «шлюзом»: правильна відповідь відкриває наступний конверт і новий розділ архіву. Інші завдання дають додаткові докази, які знадобляться у фіналі; позначені «за бажанням» можна пропустити.

      Відповідь вводять на екрані завдання. Помилка нічого не коштує, але після трьох помилок поспіль — пауза 30 секунд. Числа можна писати з комою чи крапкою; одиниці підказано поруч із полем.

      Підказки: до кожного завдання їх три, від напрямку до готового розв'язку. Кожна підказка додає 3 хвилини до таймера й знімає 3 бали з рахунку.

      Допити: на початку часу вистачає лише на двох свідків із чотирьох. Коди «Допитати» — на картках фігурантів. Оберіть, кого слухати, з розумом.
  decisions:
    title: Рішення й події
    body: |-
      Застосунок кличе вас до рішень: дзвінок начальника, прохання свідка, пропозиція журналістки… Варіанти мають наслідки — одні одразу, інші через кілька ходів, а деякі не скасуєш. Перед рішенням застосунок показує, у якій ви ситуації.

      Кожне рішення має дедлайн — відкриття наступного конверта. Якщо команда не встигла, слідча Крук вирішить сама, і не завжди так, як вирішили б ви. Завдання-«шлюз» заздалегідь попередить, які рішення ще чекають.

      Деякі події стаються в певну хвилину гри, хоч би що ви робили. Термінові справи з'являються у смузі вгорі — не відкладайте їх.
  finale:
    title: Фінал і рахунок
    body: |-
      Коли справа складеться, застосунок відкриє операцію: одну оперативну групу треба відправити за однією з адрес. Команда, що взяла не більше трьох підказок, отримує ще одну групу. Якщо не встигнете, операція почнеться сама на 85-й хвилині.

      Далі — звинувачення: чотири питання і лише одна спроба. Після нього гра завершується, і змінити вже нічого не можна.

      Епілог — газетна шпальта через рік: що сталося з винними, з експонатом, зі свідками, з невинними і зі схемою, яку ви розплутували. Рахунок складається з цих наслідків, плюс 1 бал за кожну хвилину, що лишилася до 90-ї, мінус 3 бали за кожну підказку. Розбір підкаже, де команда звернула не туди.
  levels:
    title: Рівні складності
    body: |-
      — Стажер — простіші обчислення, більше даних прямо в завданнях.
      — Слідчий — ті самі події й докази, але завдання складніші: частину даних доведеться знайти й порахувати самостійно.

      Сюжет однаковий. Важливо: комплект має бути надрукований для того рівня, який команда обрала в застосунку.
  modes:
    title: Режими й варіанти партії
    body: |-
      — Змагання команд: команди по 2–5 осіб, у кожної свій комплект. Наприкінці порівнюють рахунки.
      — Відділи: один комплект на клас, три відділи по 3–7 осіб — криміналісти (К), аналітики (А), оперативники (О). Ведучий роздає аркуші за значками. Ключові завдання потребують висновків двох відділів, а рішення ухвалюються голосуванням; за нічиєї вирішує керівник групи.
      — 60 хвилин: ведучий видає перший акт розкритим, таймер стартує з 25:00, кілька завдань стають необов'язковими.

      Рівень, режим і тривалість обирають на першому екрані застосунку.
  devices:
    title: Кілька телефонів і кілька команд
    body: |-
      Кілька телефонів однієї команди: на першому телефоні натисніть «Інші телефони команди» й відскануйте QR іншими телефонами (або надішліть посилання). Прогрес телефонів зливається — підказка, взята двічі, рахується один раз. Щоб наздогнати товаришів, відкрийте свіже посилання ще раз.

      Кілька команд на одному екрані (мультиборд): на головному екрані — «Додати команду», угорі з'явиться перемикач команд. Таймер іде в усіх.

      Прогрес зберігається на самому пристрої. Не очищайте дані браузера до кінця гри. «Почати заново» стирає гру лише активної команди.
  tips:
    title: Поради слідчим
    body: |-
      — Розкладіть документи на столі й розділіть читання: хтось на картах, хтось у архіві, хтось рахує.
      — Звіряйте документи між собою: час, відстані, числа. Люди помиляються — а іноді й неправду кажуть.
      — Записуйте версії й підозри. Застосунок не перевіряє ваших здогадок до самого фіналу.
      — Не тягніть із рішеннями, але й не поспішайте з висновками: справа може повернутися не тим боком.
  host:
    title: Ведучому
    body: |-
      Підготовка, склад конвертів, сценарій, відповіді й розгадка — у посібнику ведучого (окремий PDF із кодом ведучого). Пульт ведучого в застосунку відкривається з головного екрана кнопкою «Пульт ведучого» — там видно таймер кожної команди і можна відкрити шлюз команді, що безнадійно застрягла (+10 хв).
