# Пульт ведучого. Ці тексти потрапляють у збірку лише зашифрованими кодом ведучого.
host:
  intro: |-
    Тут відповіді, розв'язки й наслідки рішень — не показуйте їх гравцям.

    Ви роздаєте конверти, коли застосунок команди каже «Відкрийте конверт …», стежите за часом, а якщо команда застрягла надовго — відкриваєте шлюз за неї (+10 хв).
  timeline:
    t1: { when: "0–12 хв", stage: Старт, what: "Брифінг і правила, вибір рівня й режиму. Команди відкривають стартовий конверт.", give: "Стартовий конверт (аркуші 1–12)" }
    t2: { when: "~8 хв", stage: "Дзвінок начальника", what: "Р1: відкрити провадження чи закрити справу як нещасний випадок.", give: "—" }
    t3: { when: "8–25 хв", stage: "Акт 1. Місце події", what: "Допити (2 з 4), падіння (З-1), пастка 22:10 (З-2, за бажанням).", give: "Після шлюзу А — конверт А" }
    t4: { when: "25–42 хв", stage: "Акт 2. Підміна", what: "Густина (З-3), страхування (З-7). Р3 — Корж, Р7 — сержант.", give: "Після шлюзу Б — конверт Б" }
    t5: { when: "42–62 хв", stage: "Акт 3. Годинник бреше", what: "Гирі (З-4), тінь (З-5), маршрут (З-9). Р4 — Ірина, Р6 — журналістка, Р5 — охоронець; можливо, термос (З-10).", give: "Після шлюзу В — конверт В із вкладеним конвертом Г" }
    t6: { when: "62–83 хв", stage: "Акт 4. Вежа", what: "Касова книга (З-6), сейф (З-8), шифр (З-11). Р8 — Згурська.", give: "Конверт Г команда відкриває сама, коли сейф відчинено" }
    t7: { when: "83–87 хв", stage: "Операція і звинувачення", what: "Куди відправити групу (і другу, якщо підказок не більше трьох), чотири питання звинувачення. На 85-й хв операція починається сама.", give: "—" }
    t8: { when: "87–90 хв", stage: Епілог, what: "Газета через рік, розбір помилок, рахунок. Порівняйте рахунки команд.", give: "—" }
  short: |-
    Скорочена партія (60 хв): на старті оберіть «60 хвилин». Годинник стартує з 25:00, конверт А видається одразу, Р1 уже ухвалено — «відкрити провадження офіційно».

    Перед стартом коротко розкажіть, що встановлено в акті 1: Ореста штовхнули — за відстанню від стіни його горизонтальна швидкість 1,8 м/с, так не падають. Протокол огляду сержанта Дороша підправлено.

    З-2, З-7 і З-9 — за бажанням, підказки до них безкоштовні.
  departments: |-
    «Відділи»: один комплект на клас, три відділи по 3–7 осіб — К (криміналісти), А (аналітики), О (оперативники). Розкладіть аркуші за значками в кутах документів і в колонтитулі ще до різання.

    Шлюзи А, Б і Г потребують висновків двох відділів — подбайте, щоб відділи говорили між собою. Рішення ухвалюються голосуванням на мультиборді; за нічиєї вирішує керівник групи.
  stuck: |-
    Якщо команда застрягла: спершу підказки в застосунку (кожна +3 хв). Якщо й вони не допомагають, а час спливає, відкрийте шлюз за команду на цьому пульті (+10 хв). На 85-й хв операція починається сама.
  briefing: |-
    Скажіть своїми словами, 2–3 хвилини:

    «Сьогодні ви — слідча група поліції Старокаменя. Минулої ночі, у День міста, під годинниковою вежею знайшли мертвим головного зберігача музею Ореста Гайового. Вранці з'ясується, що з музею зник його головний скарб — астролябія XVII століття. Ваша керівниця — слідча Олена Крук, її голос — у застосунку.

    Почніть із листа слідчої й картки правил. Відкрийте застосунок, введіть код АС-000 або відскануйте QR на обкладинці папки, назвіть команду й оберіть рівень. Стартовий конверт відкривайте одразу, інші — лише коли застосунок скаже. Коди АС-### на документах вводьте в застосунку: так ви допитуєте свідків і перевіряєте відповіді.

    Рішення мають наслідки, і деякі не скасуєш. Допитів на початку — лише два. Помилка у відповіді нічого не коштує, підказка — три хвилини. Пишіть на документах, беріть лінійку й калькулятор. На все — 90 хвилин; наприкінці — операція, звинувачення і газета через рік».
  prep: |-
    Друк. Файл комплекту обраного рівня — по одному на команду: 24 аркуші А4, односторонній друк, масштаб 100 % (не «Підігнати до сторінки»). Кольоровий друк кращий для фото, але чорно-білий теж годиться.

    Різання. Лінії різу позначено пунктиром: наклейки й обкладинка (аркуш 1), фото 10×15, картки фігурантів, половинки А5. Шифрувальний диск (аркуш 3): виріжте обидва кола й скріпіть по центру кнопкою чи скріпкою-«метеликом».

    Конверти. П'ять конвертів C5 на команду з наклейками з аркуша 1, склад — у таблиці нижче. Конверт Г закрийте й вкладіть у конверт В. Папку (аркуші 1–3) і стартовий конверт кладіть на стіл; конверти А, Б, В тримайте в себе й видавайте, коли застосунок команди скаже «Відкрийте конверт …».

    Пристрої. Щонайменше один телефон, планшет або ноутбук на команду. Відкрийте застосунок заздалегідь, поки є інтернет, — за QR або адресою зі скісною рискою в кінці, і саме так, як гратимете (у браузері або значком на головному екрані: на iPhone це окремі сховища): далі він працює й без мережі. Кілька команд можуть грати на одному великому екрані — «Додати команду» на головному екрані. Перед грою перевірте цей пульт: адреса застосунку + #/host, код ведучого — на першій сторінці.
  scoring: |-
    Рахунок складають осі епілогу:
    — вбивця засуджена +30; взята, але виправдана за браком доказів +10; втекла +10; не встановлена 0; засуджено невинного −20;
    — астролябія в музеї +20, досі схована +5, вивезена за кордон 0;
    — охоронець Луговий живий або в лікарні +15, утік +10, загинув 0;
    — реставратор Корж вільний +10, довго під вартою +3, засуджений 0;
    — схему вивезення викрито +15;
    — правильно названо, хто зняв астролябію з вітрини, +5;
    — час: +1 за кожну хвилину, що лишилася до 90-ї в момент звинувачення (штрафи підказок і ведучого враховано);
    — кожна підказка −3 (у скороченій партії підказки до З-2, З-7, З-9 безкоштовні).

    Без бонусу за час максимум — 95. Порівнюючи команди, обговоріть і розбір: застосунок показує, де кожна звернула не туди.
  solution: |-
    Годинник бреше. Вбивця зупинила механізм о 00:40 і перевела стрілки на 22:10 — хвилину, коли сама стояла на сцені перед сотнями свідків. Справжній час дають гирі (З-4); це підтверджують дзвінок Орестові о 23:58 у білінгу, мокра бруківка під тілом (дощ ішов 00:20–01:10) і обмовка охоронця про дощ. Задача З-2 чесно вказує на реставратора Коржа — це пастка: о 22:10 на галереї нічого не сталося.

    Астролябію «вкрав» сам Гайовий. Він дізнався, що директорка Згурська й депутат Байда через антиквара Вейса готують вивезення оригіналу як дешевої речі. Тихо підмінив його легальною копією 2009 року (клеймо «К-2009» — З-3) і сховав у вежі, у ніші за південним циферблатом. Місце зашифроване в його записнику; ключ до шифру — у племінниці Ірини.

    Вбивця — головна бухгалтерка Неля Прокопчук. Роками виводила гроші через фірму родини Вейса, першою помітила копію у вітрині, у ніч свята викликала Ореста у вежу й вимагала сказати, де оригінал. Тепер шукає астролябію руками слідства: сама приносить касову книгу з «розбіжностями» директорки.

    Брехня, яку доводять числа: фото тіні знято о 17:10, а не «вранці» (З-5); сусідка чула її двері о 01:08 (З-9); касова книга (З-6) і чернетка акта зважування з 2 628 г; біла Škoda біля музею о 02:09. Свідчення або запис охоронця Лугового й телефон Вейса додають доказів. Суд засуджує, якщо доказів щонайменше два.

    Ще один шар: сержант Дорош винен Байді й підправив протокол огляду — З-1 доводить це числами. Де Прокопчук буде під час операції, залежить від витоку (рішення про журналістку й сержанта) і розгаданого шифру: у вежі, на вокзалі чи вдома.
