task:
  z1:
    title: Упав чи штовхнули?
    q:
      trainee: З якою горизонтальною швидкістю Гайовий відірвався від галереї? Відповідь — у метрах за секунду.
      detective: З якою горизонтальною швидкістю Гайовий відірвався від галереї? Відповідь — у метрах за секунду. Час падіння ніхто не дасть — порахуйте самі.
    h:
      trainee:
        "1": Порівняйте, що пише сержант у протоколі 1-01, із фото криміналістів Ц-02 у цифровому архіві (воно з'являється, коли ухвалено рішення про провадження). Де насправді позначка?
        "2": Плитка — 40 см (специфікація «Байда-Буд»). Порахуйте плитки від маркера «1» до крейдяної позначки. Час падіння — у висновку експерта.
        "3": 9 плиток × 0,4 м = 3,6 м. 3,6 м ÷ 2,0 с = 1,8 м/с. Це вже не «послизнувся».
      detective:
        "1": "Протоколу 1-01 не вірте наосліп: відстань від стіни перевірте за фото криміналістів Ц-02 у цифровому архіві. Висоту падіння беріть із розрізу вежі — і гляньте, на який бік площі впало тіло."
        "2": Південна площа на 1,6 м нижча за поріг. h = 18,0 + 1,6 = 19,6 м; t = √(2h / g). Відстань від стіни — не з протоколу, а з фото криміналістів Ц-02 (плитка 40 см).
        "3": t = √(2 · 19,6 / 9,8) = 2,0 с. 9 плиток × 0,4 м = 3,6 м. 3,6 ÷ 2,0 = 1,8 м/с.
  z2:
    title: Хто міг бути на галереї о 22:10?
    q: Якщо годинник зупинився під час боротьби, вбивця був на галереї між 22:10:00 і 22:10:59. Хто з фігурантів фізично міг там опинитися? Напишіть прізвище.
    h:
      "1": Для кожного — відстань до вежі за картою, біг 5 м/с, плюс підйом на галерею.
      "2": Підйом — 112 сходинок по 2 за секунду, тобто 56 с. Від сцени 450 м — ще 90 с бігу.
      "2.detective": Підйом рахуйте самі за розрізом вежі (2 сходинки за секунду). Від сцени — 450 м.
      "3": Встигає лише Корж — о 22:09:30 він біля дверей, на галереї о 22:10:26. Решта — після 22:11.
    solved: |-
      Крук: «Чисто. Занадто чисто».

      Прокурор уже питає, чому Корж досі на волі.

gate:
  a:
    message: |-
      1,8 м/с — так не послизуються. Ореста Гайового штовхнули.

      Протокол сержанта Дороша не збігається з фото: 1,2 м проти 3,6 м. Хтось або помилився, або дуже хотів, щоб це був нещасний випадок.

      Справа — вбивство. Відкрийте конверт А.

e1:
  message: |-
    07:15. Дзвонить начальник відділу:

    «Олено, депутат Байда вже двічі дзвонив. Свято, туристи, преса, фонд у нього в музеї ремонт фасаду робить. Нещасний випадок — і всі спокійні. Старий чоловік, нічна вежа, поручні. Ну? Що вирішуєш?»

    За хвилину приходить голосове від Байди: «Олено Вікторівно, не робіть з трагедії цирк. Місто вам буде вдячне».

e1reopen:
  message: |-
    Дзвонить судмедексперт Стицько: «Я не підпишу нещасний випадок. Скло на годиннику розбите не об камінь. Відкривайте справу».

    Провадження відновлено. Але КП «Благоустрій» уже вимило площу під вежею, криміналістів ніхто не викликав. Волонтер Тимур Савка приніс фото, яке зробив о 06:40 з телефона друга.

r1:
  prompt: Що відповісти начальнику відділу?
  opt:
    a: Відкрити кримінальне провадження офіційно
    b: Погодитись — нещасний випадок
    c: Публічно погодитись, але розслідувати таємно
  after:
    a: Провадження за ст. 115 відкрито. Криміналісти виїжджають на площу — їхні фото (Ц-02) з'являться в цифровому архіві. Байда, кажуть, кинув слухавку. Часу на допити — на двох свідків.
    b: Справу закрито як нещасний випадок. Місто дякує. Ви складаєте папери.
    c: Для всіх — нещасний випадок. Насправді знайомий криміналіст погодився неофіційно відзняти площу — його фото (Ц-02) з'являться в архіві. Офіційних допитів — не більше одного, інакше Байда дізнається.

int:
  quotaUsed: Свідок відмовляється говорити без адвоката. Письмові пояснення надійдуть пізніше — у конверті Б.
  needsE1: Спершу треба вирішити, як оформлювати справу. Слідча Крук чекає на дзвінок начальника.
  closed: Справу закрито. Допити неможливі.
  marta:
    "1": Пані Згурська, коли ви востаннє бачили Ореста Михайловича?
    "2": Учора ввечері. Я пішла з банкету о двадцять третій вісімнадцять — хотіла поговорити з ним у музеї, поки всі чекають опівнічного концерту. Прийшла десь о двадцять шість хвилин на дванадцяту.
    "3": Про що говорили?
    "4": "Про виставку у Відні. Музей отримав запрошення — це шанс для міста! А Орест уперся: «Астролябія нікуди не поїде». Ми посварилися. Я, можливо, підвищила голос."
    "5": До котрої години?
    "6": "Приблизно до двадцять третьої сорок. Він ще зачиняв кабінет, сказав: «Мені треба на вежу». Пішов десь о двадцять третій сорок п'ять. Я повернулася в ресторан, а о чверть на першу поїхала таксі додому."
    "7": Ви впевнені щодо часу? Годинник на вежі зупинився о двадцять другій десять.
    "8": Я… Я дивилася на телефон. Звідки мені знати, що там із годинником. Ви мене в чомусь звинувачуєте?
  nelya:
    "1": Пані Прокопчук, ви працювали з Орестом Михайловичем багато років?
    "2": Дев'ятнадцять. Він був… він був як батько всьому музею. Не можу повірити.
    "3": Де ви були вчора ввечері?
    "4": Удень — удома з мамою, вона лежача. Вранці, близько десятої, заходила на Ринок, коли ставили намети, — біля вежі більше не була. Увечері — на сцені, о десятій мені вручали грамоту. О двадцять третій сорок пішла пішки додому через парк, мама сама не може. Спала.
    "5": Хтось міг бажати йому зла?
    "6": Не хочу пліткувати… Але пані Згурська з ним постійно сперечалася. І в касі після свята є дивні речі — я покажу, коли дозволите. А Корж, реставратор, останнім часом весь час крутився біля Ореста Михайловича, вони щось обговорювали за зачиненими дверима.
    "7": Дякую.
    "8": А коли… коли саме він загинув? О двадцять другій десять? Боже. Під час феєрверку. Ніхто й не почув би.
  stepan:
    "1": Пане Луговий, ви чергували цієї ночі. Що бачили?
    "2": Та нічого. Футбол дивився на планшеті, Ліга чемпіонів, повтор. Пульт — от він, камери — от вони. Над вежею камера не працює з серпня, я казав.
    "3": Виходили з будівлі?
    "4": Ні. Ну, хіба на хвилинку. Та й нащо — у дощ нікого не було, всі на концерті.
    "5": Ви чогось боїтеся?
    "6": Я? Та ні. Я просто втомився. Мені ще кредит за кредитом… неважливо. Я можу йти?
  korzh:
    "1": Пане Корж, вас сфотографували біля дверей вежі о двадцять другій дев'ять. Що ви там робили?
    "2": "Чекав Ореста. Він написав мені о двадцять першій сорок три: «Давиде, о 22:05 біля вежі, важлива розмова». Ось, дивіться, повідомлення."
    "3": Про що мала бути розмова?
    "4": Не знаю. Він не прийшов. Я простояв хвилин п'ятнадцять, дивився феєрверк, десь о двадцять другій двадцять пішов додому. Удома був о двадцять другій тридцять вісім — у майстерні камера, перевірте.
    "5": Ви з ним сварилися останнім часом?
    "6": Ми з Орестом тридцять років знайомі. Ми не сваримося — ми сперечаємося про латунь. Більше нічого не скажу.

