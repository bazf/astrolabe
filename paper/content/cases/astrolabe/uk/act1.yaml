victim:
  born: 21.03.1968
  role: Головний зберігач фондів Старокамінського краєзнавчого музею
  bio: |-
    З музею, зі сторінки «Наші люди»: «Орест Михайлович — серце наших фондів. Колись учитель астрономії, тепер — охоронець кожної монети, мапи й приладу нашої колекції. Він доглядає й годинникову вежу — філію музею. Свій перший день у музеї, коли батько привів його шестирічним до вітрини з астролябією, Орест Михайлович називає "найважливішою суботою в житті"».

    Вдівець. Єдина рідна людина — племінниця Ірина, студентка.

doc:
  P00:
    title: Обкладинка справи
  P01:
    title: Картка правил
    body: |-
      Привіт, детективе!

      1. Почни з листа слідчої Крук. Відкрий застосунок і введи код АС-000 (або відскануй QR на обкладинці).
      2. Стартовий конверт «Докази» відкривай одразу. Інші конверти — лише коли застосунок скаже.
      3. Коди АС-### на документах вводь у застосунку: так ти допитуєш свідків, перевіряєш відповіді й ухвалюєш рішення. QR — для зручності, код завжди працює.
      4. Рішення мають наслідки. Деякі не можна скасувати.
      5. Застряг — бери підказку в застосунку. Кожна коштує 3 хвилини.
      6. Розклади документи на столі, пиши на них, малюй зв'язки. Лінійка й калькулятор дозволені.

      Усі персонажі та події вигадані. Будь-який збіг випадковий.
  P02:
    title: Лист слідчої Крук
    body: |-
      Група, доброго ранку. Хоча який він добрий.

      Сьогодні о 06:05 прибиральник знайшов біля підніжжя годинникової вежі на площі Ринок тіло Ореста Михайловича Гайового, головного зберігача нашого краєзнавчого музею. Учора місто святкувало День міста: феєрверк, концерт, банкет — пів Старокаменя не спало до ранку.

      Першим на місці був сержант патрульної поліції Дорош. Його протокол і фото — у конверті «Докази». Годинник на вежі зупинився о 22:10. Наручний годинник загиблого — розбитий, теж 22:10.

      Наше завдання: з'ясувати, що сталося. Нещасний випадок, самогубство чи вбивство. Часу мало, ресурсів ще менше. Допитів сьогодні встигнемо щонайбільше два — обирайте, кого слухати, з розумом.

      Кожен ваш крок фіксується в застосунку. Якщо дійдете до висновку — вводьте відповідь. Якщо ні — не вгадуйте навмання: краще візьміть підказку, хоч вона й коштує часу.

      Олена Крук, старша слідча.
  P03:
    title: Шифрувальний диск
  1-01:
    title: Протокол огляду місця події
    header: |-
      ПРОТОКОЛ
      огляду місця події

      м. Старокамінь, 13 вересня 2026 р.
      Огляд розпочато о 06:20, закінчено о 07:10.
    body: |-
      Сержант поліції патрульної поліції м. Старокамінь Дорош К. В., отримавши о 06:07 повідомлення від громадянина Гуменюка В. І. (прибиральник КП «Благоустрій»), прибув на площу Ринок о 06:12.

      Біля південної стіни годинникової вежі на бруківці виявлено тіло чоловіка віком 55–60 років, одягненого в темний костюм, накрите сірим покривалом, наданим працівниками КП. Особу встановлено за посвідченням працівника музею: Гайовий Орест Михайлович, 1968 р. н.

      Тіло розташоване на відстані 1,2 (один цілий дві десятих) метра від лінії карниза галереї вежі. Слідів боротьби на місці не виявлено.

      Поручні оглядової галереї вежі, за візуальною оцінкою знизу, перебувають в аварійному стані. Ймовірна причина смерті — падіння з висоти внаслідок нещасного випадку (втрата рівноваги).

      На правому зап'ясті потерпілого механічний годинник зі зламаним склом, стрілки показують 22:10. Годинник на вежі також зупинився о 22:10.

      Фотографування здійснено на службовий телефон. Тіло передано для судово-медичного дослідження.
    signature: Сержант поліції К. В. Дорош
  1-02:
    title: Фото. Циферблат вежі
    caption: Південний циферблат годинникової вежі, 13.09.2026, 07:00. Стрілки — 22:10.
  1-03:
    title: Фото. Наручний годинник
    caption: Наручний годинник потерпілого. Скло розбите. 22:10.
  1-04:
    title: Фото. Південна площа
    caption: Площа під південною стіною вежі, 13.09.2026, 06:25. Службове фото сержанта Дороша.
  1-05:
    title: Попередній висновок судмедексперта
    header: |-
      Обласне бюро судово-медичної експертизи
      Старокамінське районне відділення

      ПОПЕРЕДНІЙ ВИСНОВОК № 417/26
      13 вересня 2026 р.
    body: |-
      Об'єкт дослідження: тіло громадянина Гайового О. М., 1968 р. н.

      Причина смерті (попередньо): тупа поєднана травма голови й грудної клітки внаслідок падіння з висоти.

      Час настання смерті (попередньо): між 21:30 12.09 і 02:30 13.09. Точніше визначити неможливо: нічне охолодження тіла, вологість.

      Окремо: на правому зап'ясті механічний годинник. Скло розбите точковим ударом у центр; корпус і ремінець без подряпин, характерних для удару об бруківку.

      Остаточний висновок — після повного дослідження.
    extra:
      trainee: |-
        Довідково для слідчої групи: час падіння тіла з рівня оглядової галереї вежі на південну площу — близько 2,0 с.
    signature: Судово-медичний експерт Ю. О. Стицько
  1-06:
    title: Розріз годинникової вежі
    note: Архівне креслення 1964 р. (реставрація). Відмітки — від порогу вхідних дверей (±0,00). 112 сходинок від входу до галереї.
  1-07:
    title: Специфікація благоустрою площі
    body: |-
      ТОВ «Байда-Буд». Реконструкція площі Ринок, 2025 р. Витяг зі специфікації.

      1. Покриття: плитка бетонна вібропресована 400 × 400 × 60 мм, сіра, укладання прямими рядами. Рядок від південної стіни вежі починається від лінії карниза галереї.
      2. Опори освітлення «Ретро-2»: висота світлоточки 4,5 м, крок 25 м.
      3. Камери відеоспостереження над входом до вежі й службовим входом музею: перекладання кабелю — серпень 2026 р. (підключення — після свята).
  1-08:
    title: Довідка «Швидкість відриву»
    r1: "≤ 0,7 м/с — послизнувся, перехилився через поручень, втратив рівновагу"
    r2: "0,7–1,5 м/с — неоднозначно: зістрибнув, слабкий поштовх"
    r3: "≥ 1,5 м/с — сильний поштовх або розбіг"
    note: Горизонтальна швидкість у момент відриву від галереї. Опір повітря не враховано.
  1-09:
    title: Вирізка «Старокамінь Сьогодні»
    date: 11 вересня 2026
    headline: День міста-2026 — повна програма
    body: |-
      Субота, 12 вересня. Головна сцена — Замкова площа.

      18:00 — ярмарок майстрів на площі Ринок.
      19:30 — концерт міського оркестру.
      21:00 — гурт «Кам'яна Кров».
      21:55–22:15 — нагородження працівників культури (вручає депутат міськради Роман Байда).
      22:00–22:15 — святковий феєрверк над Замковою площею.
      22:30 — танцювальна програма.
      23:30–00:30 — опівнічний концерт.

      Банкет для запрошених гостей — ресторан «Під каштанами».

      Годинникова вежа на Ринку у святковий вечір зачинена для відвідувачів. Організатори нагадують: волонтерам видано жовті дощовики — синоптики обіцяють дощ уночі.
  1-10:
    title: Фото Тимура Савки (камера музею)
    caption: "Серія «22:10 і небо в огні!» Знято з балкона 3-го поверху готелю «Ринок» камерою музею з телеоб'єктивом. На першому кадрі біля дверей вежі — чоловік у капелюсі (впізнано: Д. О. Корж)."
    exif1: "DSC_0412.JPG · 12.09.2026 22:09:30 · 200 мм"
    exif2: "DSC_0413.JPG · 12.09.2026 22:10:40 · 200 мм"
  1-11:
    title: Фотозвіт і кадри камер (12.09, ніч)
    intro: Зібрано зі звіту пресслужби міськради, соцмереж і камер. Час — за мітками файлів, до секунди. Відстані до вежі виміряйте на карті 1-12.
    i1:
      source: Пресслужба міськради, Замкова площа
      text: Р. Байда вручає грамоту Н. Прокопчук на сцені.
    i2:
      source: Ресторан «Під каштанами», фото гостя банкету
      text: М. Згурська за столом.
    i3:
      source: Сторіз Ірини Гайової, фан-зона біля сцени
      text: Ірина в натовпі, на тлі — сцена.
    i4:
      source: Камера пульта охорони музею
      text: С. Луговий за пультом. Шлях від пульта до дверей вежі — 75 м (коридор і двір).
    i5:
      source: Камера крамниці «Старожитності», вул. Замкова, 7
      text: А. Вейс за прилавком.
