# Паперова партія на 40 хвилин — без застосунку, з ведучим.
# Береться вміст основної справи (case.yaml, acts/*.yaml, uk/*.yaml); тут — лише що лишити, як розкласти
# по конвертах і аркушах, нові тексти для паперу, картки ведучого та сценарій.
# Рядок, що починається з «@», — ключ у uk/*.yaml; решта — текст як є.
# Збирання: npm run paper (tools/paper/build-paper.ts).

title: "Справа № 17. Астролябія"
subtitle: "Паперова версія · 40 хвилин · з ведучим"
durationMin: 40
hintPenaltyMin: 3
gatePenaltyMin: 5
wrongRule: "Після трьох хибних відповідей поспіль на одне завдання — хвилина паузи на це завдання."

# Завдання, що лишаються, у порядку гри. З-2, З-7, З-8, З-9 вилучено (див. host.cut).
tasks:
  - { id: Z1, act: 1 }
  - { id: Z3, act: 2 }
  - { id: Z4, act: 3 }
  - { id: Z5, act: 3 }
  - { id: Z6, act: 4 }
  - { id: Z11, act: 4 }
  - { id: Z10, act: 4, branch: true }

taskOverrides:
  Z1:
    hints:
      trainee:
        - "Порівняйте, що пише сержант у протоколі 1-01, із фото криміналістів Ц-02 у стартовому конверті. Де насправді позначка?"
      detective:
        - "Протоколу 1-01 не вірте наосліп: відстань від стіни перевірте за фото криміналістів Ц-02 (стартовий конверт). Висоту падіння беріть із розрізу вежі — і гляньте, на який бік площі впало тіло."

# Шлюзи: правильна відповідь → ведучий читає картку й видає конверт.
gates:
  A:
    task: Z1
    envelope: A
    text: "1,8 м/с — так не послизуються. Ореста Гайового штовхнули.\n\nПротокол сержанта Дороша не збігається з фото: 1,2 м проти 3,6 м. Хтось або помилився, або дуже хотів, щоб це був нещасний випадок.\n\nСправа — вбивство. Ведучий видає конверт А."
  B:
    task: Z3
    envelope: B
    text: "Густина предмета з вітрини — 8,45 г/см³. Це звичайна латунь, а не позолочений оригінал. У вітрині — копія 2009 року з клеймом «К-2009».\n\nАле офіційний акт 7 вересня каже: 2 840 г, тобто оригінал. Тоді підміна сталася після 7 вересня?\n\nВедучий видає конверт Б."
  C:
    task: Z4
    envelope: C
    text: "Годинник зупинили о 00:40 і перевели стрілки на 22:10. Гирі не брешуть.\n\nУсі алібі «на 22:10» нічого не варті. Корж біля вежі о 22:10 — не вбивця, а пастка, в яку вас вели. О 22:10 найкраще алібі в місті мав той, хто був на сцені перед сотнями свідків. Згадайте, хто там стояв.\n\nКіберполіція передала білінг телефону Гайового (Ц-07). Прокурор дав ордер — слюсар відчинив сейф Ореста. Ведучий видає конверт В."

# Конверти й аркуші. Кожен рядок sheets — один аркуш А4; документи — за id.
envelopes:
  - id: folder
    label: Папка
    title: "Папка справи"
    note: "На стіл одразу"
    sheets:
      - [P00, P01]
      - [P02]
      - [P03]
  - id: start
    label: Старт
    title: "Стартовий конверт · Докази"
    note: "Відкрити одразу"
    sheets:
      - [1-01]
      - [1-02, 1-03]
      - [1-04, 1-10]
      - [1-05, 1-08]
      - [1-06, 1-07]
      - [1-12]
      - [1-13]
      - [1-14, 1-15]
      - [1-09, 1-11]
      - [C01, C02]
      - [C03, C04]
      - [C05, C06]
      - [T1]
  - id: A
    label: А
    title: "Конверт А · Підміна"
    note: "Видає ведучий після З-1"
    sheets:
      - [2-02, 2-04]
      - [2-07, 2-12]
      - [2-13, 2-14]
      - [2-01, 2-03]
      - [2-06, 2-08]
      - [DB]
      - [T2]
  - id: B
    label: Б
    title: "Конверт Б · Годинник"
    note: "Видає ведучий після З-3"
    sheets:
      - [3-01, 3-02]
      - [3-03, 3-05]
      - [3-10, 3-13]
      - [3-04, 3-09]
      - [3-07, 3-12, 3-08]
      - [T3]
  - id: C
    label: В
    title: "Конверт В · Вежа"
    note: "Видає ведучий після З-4"
    sheets:
      - [4-01]
      - [C07, 4-04]
      - [4-02, 4-03]
      - [4-05, 4-06]
      - [4-09, C09]
      - [4-10]
      - [T4]

# Нові документи й заміни властивостей наявних (props зливаються поверх основних).
docs:
  - id: P00
    component: PaperCover
    props: {}
  - id: P01
    props:
      body: "Привіт, детективе!\n\n1. Почни з листа слідчої Крук. Стартовий конверт «Докази» відкривай одразу. Інші конверти видає ведучий — лише коли ви розв'яжете ключове завдання.\n2. Відповідь на завдання пишіть на «Аркуші слідчого» й показуйте ведучому. Помилка нічого не коштує.\n3. Застрягли — попросіть у ведучого підказку. Кожна коштує 3 бали й 3 хвилини.\n4. Ведучий приноситиме дзвінки й рішення. Рішення мають наслідки, деякі не скасуєш.\n5. На все — 40 хвилин."
  - id: P02
    props:
      body: "Група, доброго ранку. Хоча який він добрий.\n\nСьогодні о 06:05 прибиральник знайшов біля підніжжя годинникової вежі на площі Ринок тіло Ореста Михайловича Гайового, головного зберігача нашого краєзнавчого музею. Учора місто святкувало День міста: феєрверк, концерт, банкет — пів Старокаменя не спало до ранку.\n\nПершим на місці був сержант патрульної поліції Дорош. Його протокол і фото — у конверті «Докази». Годинник на вежі зупинився о 22:10. Наручний годинник загиблого — розбитий, теж 22:10.\n\nНачальник тиснув закрити справу як нещасний випадок. Я відкрила провадження офіційно: криміналісти вже відзняли площу (Ц-02), четверо свідків дали показання — усе в конверті.\n\nНаше завдання: з'ясувати, що сталося. Часу мало — сорок хвилин. Якщо дійдете до висновку — показуйте відповідь ведучому. Якщо ні — не вгадуйте навмання: краще візьміть підказку.\n\nОлена Крук, старша слідча."
  - id: 1-14
    strip: [code]
  - id: 1-15
    strip: [code]
  - id: 2-12
    strip: [code]
  - id: 2-14
    strip: [code]
  - id: 3-13
    strip: [code]
  - id: 4-09
    strip: [code]
  - id: C09
    title: "Телефон Ірини Гайової"
    props:
      body: "Ірина Гайова, почувши про сейф, сама приходить до відділу й показує телефон.\n\nМесенджер, 13.09, 00:31, від «Дядько Орест»:\n\n«Іро, якщо зі мною щось станеться — ключ у тебе. Не довіряй нікому з музею».\n\nВкладення — фото аркуша з написом рукою Ореста: «Полярна над нашим містом».\n\nІрина: «Він усе життя шифрував мені записки — з дитинства. Ключ — це висота Полярної зірки. Я не знаю, що це значить»."
  - id: DB
    label: Ц-11
    title: "Витяг з бази даних поліції"
    component: DbExtract
    dept: O
    props: {}
  - id: T1
    label: "Аркуш 1"
    title: "Аркуш слідчого № 1"
    component: PaperTaskSheet
    props: { number: 1, tasks: [Z1] }
    levels:
      trainee:
        intro: "Перше завдання — з'ясувати, чи був це нещасний випадок. Правильна відповідь на З-1 відкриває конверт А."
        data: "Швидкість = відстань ÷ час.\nПлитка на площі — квадрат 40 × 40 см."
      detective:
        intro: "З'ясуйте, чи був це нещасний випадок. Правильна відповідь на З-1 відкриває конверт А. Довідкові дані — лише ті, що в документах."
        data: "g = 9,8 м/с².\nМасштаб карти — на карті."
  - id: T2
    label: "Аркуш 2"
    title: "Аркуш слідчого № 2"
    component: PaperTaskSheet
    props: { number: 2, tasks: [Z3] }
    levels:
      trainee:
        intro: "Музей заявив про можливу підміну астролябії. Перевірте, що стоїть у вітрині. Правильна відповідь на З-3 відкриває конверт Б."
        data: "@sheet2.data.trainee"
      detective:
        intro: "Перевірте, що стоїть у вітрині, і порахуйте, чого бракує. Правильна відповідь на З-3 відкриває конверт Б."
        data: "@sheet2.data.detective"
  - id: T3
    label: "Аркуш 3"
    title: "Аркуш слідчого № 3"
    component: PaperTaskSheet
    props: { number: 3, tasks: [Z4, Z5] }
    levels:
      trainee:
        intro: "Справжній час зупинки годинника (З-4) відкриває конверт В. З-5 перевіряє алібі Прокопчук — доказ для суду. Розв'язуйте паралельно."
        data: "Гиря ходу — 12 см/год; гиря бою — 1,5 см за удар.\nПлитка — 40 см; ліхтар — 4,5 м. Відношення = довжина тіні ÷ висота."
        table: "$doc:3-11.trainee.table"
      detective:
        intro: "Справжній час зупинки (З-4) відкриває конверт В. З-5 перевіряє її алібі — доказ для суду."
        data: "tg α = висота ÷ довжина тіні."
        table: "$doc:3-11.detective.table"
  - id: T4
    label: "Аркуш 4"
    title: "Аркуш слідчого № 4"
    component: PaperTaskSheet
    props: { number: 4, tasks: [Z6, Z11] }
    levels:
      trainee:
        intro: "Сейф Ореста відчинено. Касова книга (З-6) — доказ мотиву. Шифр записника (З-11) скаже, де оригінал. Розв'язуйте паралельно — фінал о 36-й хвилині."
        data: "@sheet4.data.trainee"
      detective:
        intro: "Сейф відчинено. Касова книга (З-6) — мотив, шифр (З-11) — місце. Фінал о 36-й хвилині."
        data: "@sheet4.data.detective"

# Документи, які ведучий видає за рішенням (лежать у пачці ведучого, не в конвертах).
outcomeDocs: [C-KORZH, C13, C10, C10b, C15, C12, C14]

# Картки подій (читає ведучий; у «Відділах» — уголос для всіх).
events:
  - id: E-R3
    when: "≈ 2 хв після конверта А (≈ 13-та хв)"
    text: "@er3.message"
    then: "Видайте картку рішення Р3."
  - id: E-R7
    when: "≈ 4 хв після конверта А (≈ 15-та хв)"
    text: "@er7.message"
    then: "Видайте картку рішення Р7."
  - id: E-TRAP
    when: "разом із конвертом Б — лише якщо Р7 = «б»"
    text: "@etrap.message"
    then: "Позначте в протоколі: Вейс затриманий."
  - id: E3
    when: "≈ 3 хв після конверта Б (≈ 22-га хв)"
    text: "@e3.message"
    then: "Видайте картку рішення Р5."
  - id: E-VEISPHONE
    when: "разом із конвертом В — лише якщо Вейс затриманий (Р7 = «б»)"
    text: "Кіберполіція розблокувала телефон Вейса. Листування — у документі Ц-12."
    then: "Видайте документ Ц-12."
  - id: E4
    when: "4 хв після рішення Р5 «б» або «в» (і не пізніше 31-ї хв)"
    text: "Лугового знайшли без тями біля музею. Поруч термос. Його везуть у реанімацію.\n\nТоксиколог просить дозу — дані в документі Ц-15, завдання З-10. У вас п'ять хвилин."
    then: "Видайте Ц-15 і аркуш З-10. Засічіть 5 хвилин."
  - id: E4-DEAD
    when: "через 5 хв після E4, якщо З-10 не розв'язано"
    text: "@e4dead.message"
    then: "Позначте в протоколі: Луговий загинув."
  - id: E5
    when: "36-та хв"
    text: "20:30. Останній потяг до кордону — о 21:40. Часу на роздуми не лишилося.\n\nОперативна група чекає наказу."
    then: "Видайте картку «Операція» (і «Друга група», якщо команда взяла не більше трьох підказок). Хвилина на вибір."

# Картки рішень: варіанти, що прочитати після вибору, що видати.
decisions:
  - id: R3
    given: "з подією E-R3"
    deadline: "до конверта Б"
    default: b
    options:
      a: { after: "@r3.after.a", note: "Корж під вартою. Відтепер команда будь-коли може його звільнити — картка Р3+." }
      b: { after: "@r3.after.b" }
      c: { after: "Корж погоджується допомогти з металом. І додає:\n\n«29 серпня Орест попросив мене принести копію зі сховища. І нікому не казати. Тепер я, здається, розумію навіщо».\n\nЙого консультація — у документі, який видає ведучий.", give: [C-KORZH] }
  - id: R3release
    given: "якщо Р3 = «а»: картку тримає команда"
    options:
      release: { after: "Коржа звільнено. На порозі він каже: «29 серпня Орест попросив мене принести копію зі сховища. Тепер ви знаєте все, що знаю я»." }
  - id: R7
    given: "з подією E-R7"
    deadline: "до конверта Б"
    default: c
    options:
      a: { after: "Дороша відсторонено до службового розслідування. Його пояснення — у документі, який видає ведучий. Байда, кажуть, уже телефонує своєму адвокату.", give: [C13] }
      b: { after: "@r7.after.b", note: "З конвертом Б прочитайте подію E-TRAP: Вейса затримано." }
      c: { after: "@r7.after.c", note: "Витік: Дорош чує все, що знає група." }
  - id: R5
    given: "з подією E3"
    deadline: "до конверта В"
    default: c
    options:
      a: { after: "Лугового забрали під охорону. Його свідчення — у документі, який видає ведучий. Прокурор арешту не дає — «збирайте решту». Хтось у музеї вже помітив, що Луговий зник.", give: [C10] }
      b: { after: "Луговий іде на зустріч з диктофоном, без прикриття — єдину групу бережуть на фінал. Запис (документ від ведучого) обривається на словах про термос.", give: [C10b], note: "Через 4 хв — подія E4 (отруєння)." }
      c: { after: "@r5.after.c", note: "Через 4 хв — подія E4 (отруєння)." }
      d: { after: "@r5.after.d" }
  - id: R8
    given: "разом із конвертом В"
    deadline: "до операції (36-та хв)"
    default: c
    options:
      a: { after: "Згурська підписує угоду. Її заява — у документі, який видає ведучий. Через рік вона очолить музей в іншому місті.", give: [C14] }
      b: { after: "@r8.after.b" }
      c: { after: "@r8.after.c" }
  - id: R9
    given: "з подією E5 (36-та хв)"
    deadline: "1 хвилина"
    options:
      tower: { after: "@r9.after" }
      station: { after: "@r9.after" }
      shop: { after: "@r9.after" }
      home: { after: "@r9.after" }
  - id: R9b
    given: "з подією E5 — лише якщо команда взяла не більше трьох підказок"
    deadline: "1 хвилина"
    options:
      tower: {}
      station: {}
      shop: {}
      home: {}

# Сценарій партії (посібник ведучого).
timeline:
  - { when: "0–3", stage: "Брифінг", what: "Прочитайте вступ (нижче). Команди відкривають папку й стартовий конверт. Таймер — 40 хвилин.", give: "Папка, стартовий конверт" }
  - { when: "3–11", stage: "Акт 1. Місце події", what: "Падіння (З-1). Оперативники читають допити й картки, криміналісти рахують.", give: "Після З-1 — картка шлюзу А і конверт А" }
  - { when: "11–19", stage: "Акт 2. Підміна", what: "Густина (З-3). Дзвінок прокурора → Р3 (Корж), сержант Дорош → Р7.", give: "Після З-3 — картка шлюзу Б і конверт Б" }
  - { when: "19–29", stage: "Акт 3. Годинник бреше", what: "Гирі (З-4) і тінь (З-5) паралельно. Дзвінок Лугового → Р5.", give: "Після З-4 — картка шлюзу В, конверт В, картка Р8" }
  - { when: "29–36", stage: "Акт 4. Вежа", what: "Касова книга (З-6) і шифр (З-11) паралельно; можливо — термос (З-10). Р8 — Згурська.", give: "Документи за рішеннями" }
  - { when: "36–38", stage: "Операція і звинувачення", what: "E5 → куди відправити групу (і другу, якщо підказок ≤ 3). Бланк звинувачення — 4 питання, одна спроба.", give: "Картки «Операція», бланк звинувачення" }
  - { when: "38–40", stage: "Епілог і рахунок", what: "Порахуйте епілог за таблицею, прочитайте газету через рік і розбір, оголосіть рахунок.", give: "—" }

# Контрольні точки: якщо команда не встигла, ведучий відкриває шлюз сам (+5 хв штрафу).
checkpoints:
  - { gate: A, by: 13 }
  - { gate: B, by: 21 }
  - { gate: C, by: 30 }

host:
  briefing: "Скажіть своїми словами, 2–3 хвилини:\n\n«Сьогодні ви — слідча група поліції Старокаменя. Минулої ночі, у День міста, під годинниковою вежею знайшли мертвим головного зберігача музею Ореста Гайового. Вранці з'ясується, що з музею зник його головний скарб — астролябія XVII століття. Ваша керівниця — слідча Олена Крук.\n\nПочніть із її листа й картки правил. Стартовий конверт відкривайте одразу. Інші конверти я видаю, коли ви правильно розв'яжете ключове завдання. Відповідь пишіть на аркуші слідчого й показуйте мені.\n\nРішення мають наслідки, і деякі не скасуєш. Помилка у відповіді нічого не коштує, підказка — 3 бали і 3 хвилини. Пишіть на документах, беріть лінійку й калькулятор. На все — 40 хвилин; наприкінці — операція, звинувачення і газета через рік»."
  role: "Ви — «застосунок»: перевіряєте відповіді, видаєте конверти, читаєте дзвінки й рішення, стежите за часом і наприкінці рахуєте епілог. Усе, що для цього потрібно, — у цьому посібнику, пачці карток і протоколі партії (по одному на команду)."
  cut: "Що змінено проти повної гри (90 хв): Р1 ухвалено заздалегідь — провадження відкрито офіційно (фото криміналістів Ц-02 і всі чотири допити — у стартовому конверті). Вилучено завдання З-2 (пастка 22:10), З-7 (страхування), З-8 (сейф — його відчиняють за ордером), З-9 (дорога додому) і рішення Р4 (Ірина) та Р6 (журналістка). Телефон Ірини (Ц-09) лежить у конверті В — у ньому ключ до шифру. Термос (З-10) лишився як термінова гілка. Бонус за час — від 40 хвилин, а не від 90."
  departments: "«Відділи»: один комплект на всіх (до 20 гравців), три відділи по 3–7 осіб — К (криміналісти), А (аналітики), О (оперативники). Розкладіть аркуші за значками в кутах документів (таблиця нижче). Аркуші слідчого й документи без значка — для всіх.\n\nЗавдання з двома значками приймайте, лише коли відповідь підтверджують обидва відділи. Рішення — голосування відділів (по голосу на відділ); за нічиєї вирішує керівник групи, якого відділи обрали на старті."
  competition: "«Змагання»: команди по 2–5 осіб, у кожної свій комплект, свій набір карток і свій протокол. Перевіряйте відповіді й видавайте конверти кожній команді окремо; події читайте біля столу команди."
  stuck: "Якщо команда застрягла: спершу підказки (по черзі 1 → 2 → 3, кожна −3 бали й +3 хв). Якщо команда не встигла до контрольної точки, прочитайте третю підказку, видайте шлюз і конверт самі (+5 хв штрафу) — інакше гра не вміститься в 40 хвилин."
  solution: "Годинник бреше. Вбивця зупинила механізм о 00:40 і перевела стрілки на 22:10 — хвилину, коли сама стояла на сцені перед сотнями свідків. Справжній час дають гирі (З-4); це підтверджують дзвінок Орестові о 23:58 у білінгу, повідомлення Ірині о 00:31, мокра бруківка під тілом (дощ ішов 00:20–01:10) і обмовка охоронця про дощ. Фото Тимура з Коржем біля дверей о 22:09 — пастка: о 22:10 на галереї нічого не сталося.\n\nАстролябію «вкрав» сам Гайовий. Він дізнався, що директорка Згурська й депутат Байда через антиквара Вейса готують вивезення оригіналу як дешевої речі. Тихо підмінив його легальною копією 2009 року (клеймо «К-2009» — З-3) і сховав у вежі, у ніші за південним циферблатом. Місце зашифроване в його записнику; ключ до шифру — у племінниці Ірини.\n\nВбивця — головна бухгалтерка Неля Прокопчук. Роками виводила гроші через фірму родини Вейса, першою помітила копію у вітрині, у ніч свята викликала Ореста у вежу й вимагала сказати, де оригінал. Тепер шукає астролябію руками слідства: сама приносить касову книгу з «розбіжностями» директорки.\n\nБрехня, яку доводять числа: фото тіні знято о 17:10, а не «вранці» (З-5); сусідка чула її двері о 01:08; касова книга (З-6) і чернетка акта зважування з 2 628 г; біла Škoda біля музею о 02:09. Свідчення або запис охоронця Лугового й телефон Вейса додають доказів. Суд засуджує, якщо доказів щонайменше два.\n\nЩе один шар: сержант Дорош винен Байді й підправив протокол огляду — З-1 доводить це числами. Де Прокопчук буде під час операції, залежить від витоку (рішення про сержанта), від того, чи злякали її (рішення про Лугового), і від розгаданого шифру: у вежі, на вокзалі чи вдома."

rules:
  title: "Як грати"
  intro: "«Справа № 17. Астролябія» — паперова детективна гра на 40 хвилин для 2–20 гравців від 16 років. Ви — слідча група поліції містечка Старокамінь: у ніч Дня міста під годинниковою вежею знайшли мертвим головного зберігача музею. Усі докази — на папері, у папці й чотирьох конвертах. Ведучий перевіряє відповіді, видає конверти й приносить дзвінки та рішення.\n\nМета — з'ясувати, що сталося, ухвалити рішення, з якими доведеться жити, і наприкінці назвати винних."
  sections:
    - title: "Що потрібно"
      body: "— Комплект на команду (друкує й готує ведучий): папка, стартовий конверт і конверти А, Б, В.\n— Лінійка, калькулятор, ручки. Писати на документах можна й потрібно.\n— Ведучий із посібником, картками й протоколом партії. Телефони не потрібні."
    - title: "Хід розслідування"
      body: "Справа поділена на чотири акти. Кожен закінчується ключовим завданням — «шлюзом»: правильна відповідь відкриває наступний конверт. Інші завдання дають докази, які знадобляться у фіналі.\n\nВідповідь пишіть на «Аркуші слідчого» й показуйте ведучому — він скаже «так» або «ні». Помилка нічого не коштує, але після трьох помилок поспіль на одне завдання — хвилина паузи. Числа можна писати з комою чи крапкою.\n\nПідказки: до кожного завдання їх три, від напрямку до готового розв'язку. Кожна підказка знімає 3 бали й додає 3 хвилини до вашого часу."
    - title: "Рішення й події"
      body: "Ведучий приносить дзвінки й картки рішень: прокурор, сержант, свідок… Варіанти мають наслідки — одні одразу, інші через кілька хвилин, а деякі не скасуєш. Скажіть ведучому літеру варіанта — він прочитає, що сталося, і, можливо, дасть новий документ.\n\nКожне рішення має дедлайн — наступний конверт. Не встигли — слідча Крук вирішить сама, і не завжди так, як вирішили б ви."
    - title: "Фінал і рахунок"
      body: "На 36-й хвилині — операція: одну оперативну групу треба відправити за однією з чотирьох адрес. Команда, що взяла не більше трьох підказок, отримує ще одну групу.\n\nДалі — бланк звинувачення: чотири питання і лише одна спроба. Ведучий за таблицею складає епілог — газету через рік: що сталося з винними, з експонатом, зі свідками, з невинними і зі схемою. Рахунок — за епілог, мінус підказки, плюс хвилини, що лишилися до 40-ї."
    - title: "Рівні складності"
      body: "— Стажер — простіші обчислення, більше даних прямо в завданнях.\n— Слідчий — ті самі події й докази, але завдання складніші: частину даних доведеться знайти й порахувати самостійно.\n\nСюжет однаковий. Комплект і картки підказок друкуються для обраного рівня."
    - title: "Режими"
      body: "— Змагання команд: команди по 2–5 осіб, у кожної свій комплект. Наприкінці порівнюють рахунки.\n— Відділи: один комплект на всіх (до 20 гравців), три відділи по 3–7 осіб — криміналісти (К), аналітики (А), оперативники (О). Ведучий роздає аркуші за значками в кутах. Ключові завдання з двома значками потребують висновків обох відділів, а рішення ухвалюються голосуванням відділів; за нічиєї вирішує керівник групи."
    - title: "Поради слідчим"
      body: "— Розкладіть документи на столі й розділіть читання: хтось на картах, хтось на допитах, хтось рахує.\n— Звіряйте документи між собою: час, відстані, числа. Люди помиляються — а іноді й неправду кажуть.\n— Записуйте версії й підозри. Ведучий не перевіряє ваших здогадок до самого фіналу.\n— 40 хвилин — це мало. Не тягніть із рішеннями, але й не поспішайте з висновками."
